function ensureAnalytics(x){
if(x.interests===undefined)x.interests=CHANNEL_TOPIC_SEEDS.map(t=>({...t,channels:[...t.channels],favorite:true,channelFavorites:{}}));
if(x.traffic===undefined)x.traffic=[];
if(Array.isArray(x.interests)&&x.channelTopicsVersion!==1){
 for(const t of x.interests){if(!t||typeof t!=='object')continue;const seed=CHANNEL_TOPIC_SEEDS.find(s=>s.id===t.id);if(t.channels===undefined)t.channels=seed?[...seed.channels]:['islam','identity'].includes(t.id)?['blog','insta']:Object.keys(CH);if(t.channelFavorites===undefined)t.channelFavorites={};if(seed&&t.note===undefined)t.note=seed.note;}
 for(const seed of CHANNEL_TOPIC_SEEDS){if(!x.interests.some(t=>t?.id===seed.id))x.interests.push({...seed,channels:[...seed.channels],favorite:true,channelFavorites:{}});}
 x.channelTopicsVersion=1;
}return x}

ysis-mini"><div class="panel"><span class="small">${metric.kind==='search'?'검색어':'주제'} 수</span><strong>${groups.length}</strong><span class="small">현재 조건에 맞는 항목</span></div><div class="panel"><span class="small">관심 주제 교집합</span><strong style="color:var(--lime)">${matches.length}</strong><span class="small">기록 값이 0보다 큰 항목</span></div><div class="panel"><span class="small">관측 범위</span><strong>${observedMonthCount?observedMonthCount+'개월':'—'}</strong><span class="small">입력되지 않은 월은 제외</span></div></div>${rows.length?`<div class="analysis-callout">${matches.length?`<strong>관심 주제와 실측이 겹치는 항목 ${matches.length}개</strong><p>선택 지표가 가장 큰 항목: ‘${esc(matches[0].term)}’ · ${matches[0].value.toLocaleString()}${metric.unit}. 기록된 범위 안의 관측이며, 검색 시장 규모나 예상 매출을 뜻하지 않습니다.</p>`:'<strong>현재 조건에서 관심 주제와 겹치는 실측 항목이 없습니다.</strong><p>각 기록의 관심 주제 분류와 관심 설정을 확인하거나, 아래 조사 후보를 소재로 저장하세요.</p>'}</div><div class="analysis-table-wrap"><table class="analysis-table"><thead><tr><th>${metric.kind==='search'?'유입 검색어':'콘텐츠 주제'}</th><th>연결한 관심 주제</th><th style="text-align:right">${metric.label}</th><th>관측 월</th><th>근거·작업</th></tr></thead><tbody>${sorted.map(g=>{const topics=[...g.topicIds].map(id=>db.interests.find(t=>t.id===id)).filter(Boolean);return `<tr><td><strong>${esc(g.term)}</strong><div class="small">${g.rows.length}건 기록</div></td><td>${topics.length?topics.map(t=>`<div>${topicEnabled(t,analysisChannel)?'☆ ':''}${esc(t.name)}</div>`).join(''):'<span class="small">미분류</span>'}</td><td class="metric">${g.value.toLocaleString()}<span class="small"> ${metric.unit}</span></td><td>${[...new Set(g.rows.map(r=>r.month))].sort().map(esc).join('<br>')}</td><td><div class="actions"><button class="btn ghost" data-traffic-source="${esc(g.rows[0].id)}">근거</button><button class="btn" data-traffic-idea="${esc(g.rows[0].id)}">소재로</button></div></td></tr>`}).join('')}</tbody></table></div>`:`<div class="analysis-empty"><div style="font-size:29px;color:var(--lime);margin-bottom:10px">⌕</div><h3>${db.traffic.length?'현재 조건에 맞는 기록이 없습니다.':'아직 실제 유입 데이터가 없습니다.'}</h3><p>통계 화면에서 확인한 월별 값을 입력하면 검색어·주제별로 묶고, 관심 주제와 겹치는 기록을 찾아줍니다. 데이터가 없다는 뜻은 유입이 0이라는 뜻이 아닙니다.</p><button class="btn primary" data-action="newTraffic">첫 유입 기록 추가</button></div>`}<details class="analysis-notes"><summary>분석 기준과 플랫폼별 데이터 안내</summary><p><strong>현재 범위:</strong> ${esc(analysisScope())}. 검색·관심 주제 필터도 적용됩니다. 같은 검색어의 서로 겹치지 않는 월별 횟수만 더합니다. 플랫폼·지표 간 합산이나 종합 점수는 만들지 않습니다.</p><p><strong>입력 단위:</strong> 계정 하나의 월 전체 합계 × 검색어 또는 주제 × 지표입니다. 게시물별 값과 계정 합계를 중복 입력하지 마세요. 주제별 합계를 계산할 때 한 게시물을 여러 주제에 중복 배정하지 마세요. 진행 중인 월은 중간 집계일 수 있습니다.</p><p><strong>누락:</strong> 미입력 값은 0으로 대체하지 않습니다. 일부 검색어만 보고되는 통계는 전체 유입을 나타내지 않습니다. 플랫폼의 월 집계 시간대를 그대로 사용하며, 서로 다른 시간대의 월 경계를 일치시켰다고 가정하지 않습니다.</p><p><strong>네이버:</strong> 내 블로그 통계의 검색 유입 보고서를 확인해 검색어별 횟수를 입력하세요. 비율만 보이면 전체 값과 일치하는 분모 없이 횟수로 환산하지 마세요.</p><p><strong>유튜브:</strong> 검색 유입 조회수와 전체 주제별 조회수를 별도로 기록하세요. <a href="https://support.google.com/youtube/answer/12220281?hl=ko" target="_blank" rel="noopener noreferrer">YouTube 공식 실적 안내</a> · <a href="https://developers.google.com/youtube/reporting/v1/reports" target="_blank" rel="noopener noreferrer">검색어 보고의 제한</a></p><p><strong>인스타:</strong> 이 도구는 조회·저장·공유의 주제별 반응을 받으며, 해당 반응에서 실제 유입 검색어를 역추정하지 않습니다.</p><p><strong>추천 기준:</strong> 사용자가 연결한 관심 주제에 해당하고 선택 지표가 0보다 큰 항목을 표시합니다. 정렬은 같은 지표의 기록 값 순이며 인과관계·성장률·수익 가능성을 판단하지 않습니다. 같은 검색어의 월별 관심 분류가 다르면 함께 표시하며, 관심 주제에 연결된 월의 값이 0보다 클 때 교집합에 포함합니다. 데이터 없는 조사 후보는 별도로 구분합니다.</p><button class="btn ghost" data-action="exportTraffic">↓ 현재 조건의 근거 JSON</button></details></section><aside class="analysis-sidebar"><section class="panel"><div class="sectionhead" style="margin-top:0"><h2>내가 다루고 싶은 주제</h2><button class="linkbtn" data-action="manageInterests">편집 ↗</button></div><p class="small">대화에서 말한 관심사를 초기값으로 넣었습니다. 별을 눌러 분석 대상에서 켜고 끄세요.</p><div class="interest-chips">${topicsFor(analysisChannel).map(t=>`<button class="interest-chip ${topicEnabled(t,analysisChannel)?'':'off'}" data-toggle-topic="${esc(t.id)}" data-topic-channel="${analysisChannel}" aria-pressed="${topicEnabled(t,analysisChannel)}">${topicEnabled(t,analysisChannel)?'★':'☆'} ${esc(t.name)}</button>`).join('')||'<span class="small">관심 주제를 추가하세요.</span>'}</div></section><section class="panel" style="margin-top:16px"><h2>다음 조사 후보</h2><p class="small">편집용 제안 · 인기·유입이 검증된 결과가 아닙니다.</p>${favoriteTopics(analysisChannel).map(t=>`<div class="topic-card"><h3>${esc(t.name)}</h3><p>${analysisChannel==='blog'?'용어·배경·원문을 정리할 수 있는 질문을 찾아보세요.':analysisChannel==='insta'?'한 개념을 출처와 함께 설명하는 카드뉴스 소재로 기록하세요.':'직접 관찰과 근거를 구분해 설명할 질문을 기록하세요.'}</p><button class="btn ghost" data-topic-idea="${esc(t.id)}">조사 소재로 저장 ＋</button></div>`).join('')||'<p class="small">관심 주제를 켜면 조사 후보가 표시됩니다.</p>'}</section></aside></div>`}
function interestModal(){channelInterestModal()}
function trafficModal(id){const r=db.traffic.find(r=>r.id===id),c=r?.channel||analysisChannel;modal(`<div class="modalhead"><h2 id="modalTitle">${r?'유입 기록 수정':'월별 유입·반응 기록'}</h2><button class="close" data-action="close" aria-label="닫기">×</button></div><form id="trafficForm" data-id="${esc(id||'')}"><div class="form-grid"><div class="field"><label for="trafficChannel">플랫폼</label><select id="trafficChannel">${Object.keys(CH).map(k=>`<option value="${k}" ${c===k?'selected':''}>${CH[k].name}</option>`).join('')}</select></div><div class="field"><label for="trafficMonth">관측 월</label><input type="month" class="input" id="trafficMonth" value="${esc(r?.month||monthNow())}" required></div></div><div class="field"><label for="trafficMetric">기록 지표</label><select id="trafficMetric">${Object.entries(MEASURES[c]).map(([k,v])=>`<option value="${k}" ${(r?.metric||(c===analysisChannel?analysisMetric:Object.keys(MEASURES[c])[0]))===k?'selected':''}>${v.label}</option>`).join('')}</select></div><div class="field"><label for="trafficTerm">검색어 또는 콘텐츠 주제</label><input class="input" id="trafficTerm" required maxlength="200" value="${esc(r?.term||'')}" placeholder="통계에서 확인한 검색어나 직접 분류한 주제"></div><div class="form-grid"><div class="field"><label for="trafficValue">월 전체 횟수 · 정수</label><input type="number" class="input" id="trafficValue" min="0" max="9007199254740991" step="1" value="${r?r.value:''}" required placeholder="데이터 없으면 입력하지 마세요"></div><div class="field"><label for="trafficTopic">연결할 관심 주제</label><select id="trafficTopic"><option value="">미분류</option>${db.interests.map(t=>`<option value="${esc(t.id)}" ${r?.topicId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div></div><div class="field"><label for="trafficSource">근거 · 보고서명 / 원문 위치 / 집계 범위 / 확인 날짜</label><textarea id="trafficSource" required placeholder="예: 내 채널 통계 → 검색 유입, 해당 월 계정 전체 합계. 확인 날짜와 원문 위치를 적으세요.">${esc(r?.source||'')}</textarea></div><p class="help">동일 플랫폼·월·지표·검색어는 한 번만 기록합니다. 실제 통계를 옮겨 적는 기능이며 값의 진위를 자동 검증하지 않습니다.</p><div class="modalfooter"><button class="btn ghost" type="button" data-action="close">취소</button><button class="btn primary" type="submit">기록 저장</button></div></form>`)}
function trafficSources(id){const first=db.traffic.find(r=>r.id===id);if(!first)return;const rows=analysisRows().filter(r=>r.term.trim().toLowerCase()===first.term.trim().toLowerCase());modal(`<div class="modalhead"><h2 id="modalTitle">${esc(first.term)} · 근거</h2><button class="close" data-action="close" aria-label="닫기">×</button></div><p class="subtitle">${esc(analysisScope())} · 사용자 입력 자료</p>${rows.map(r=>`<div style="margin-top:18px"><div class="sectionhead"><strong>${esc(r.month)} · ${r.value.toLocaleString()}회</strong><button class="btn ghost" data-traffic-edit="${esc(r.id)}">수정</button></div><div class="source-block">${esc(r.source)}</div><div class="help">최종 입력: ${new Date(r.updated).toLocaleString('ko-KR')} · 관심 분류: ${esc(db.interests.find(t=>t.id===r.topicId)?.name||'미분류')}</div></div>`).join('')}<p class="help">위 월별 횟수를 합산합니다. 관측되지 않은 월은 계산에 추가하지 않습니다.</p>`)}
function addAnalyticalIdea(r,topic){const c=r?.channel||analysisChannel,name=r?.term||topic.name;const observed=r?analysisRows().filter(x=>x.term.trim().toLowerCase()===r.term.trim().toLowerCase()):[];const total=observed.reduce((sum,x)=>sum+x.value,0);const note=r?`[사용자 입력 통계에서 가져온 소재]\n플랫폼: ${CH[c].name}\n지표: ${MEASURES[c][r.metric].label}\n범위: ${analysisMonth==='all'?'입력된 모든 월':analysisMonth}\n기록 값: ${total}회\n연결 주제: ${[...new Set(observed.map(x=>db.interests.find(t=>t.id===x.topicId)?.name).filter(Boolean))].join(', ')||'미분류'}\n\n이 기록은 일부 유입·반응 자료이며 시장 전체 수요나 매출을 의미하지 않습니다.\n직접 경험: [본인이 작성]\n확인할 사실: [원문 조사]\n내 해석: [본인이 작성]`:`[관심 주제에서 만든 조사 후보 / 실측 인기 근거 없음]\n주제: ${topic.name}\n플랫폼: ${CH[c].name}\n\n직접 관찰한 사례가 있는가?\n용어와 제도를 설명하는 1차 자료는 무엇인가?\n다른 해석과 비교의 한계는 무엇인가?\n\n경험과 주장은 조사 후 직접 작성하세요.`;const i={id:uid(),title:name,note,sources:observed.map(x=>`${x.month} · ${x.source}`).join('\n\n'),created:Date.now(),sample:false};db.ideas.unshift(i);log('분석에서 소재 저장: '+name);persist();toast('경험·소재함에 저장했습니다.');}
function batchTrafficModal(){const example=[{channel:analysisChannel,month:monthNow(),metric:analysisMetric,term:'통계에서 확인한 검색어 또는 주제',value:null,topicId:null,source:'보고서명·집계 범위·확인 날짜'}];modal(`<div class="modalhead"><h2 id="modalTitle">유입 기록 일괄 입력</h2><button class="close" data-action="close" aria-label="닫기">×</button></div><p class="subtitle">아래 형식의 JSON 배열을 붙여 넣으세요. value의 null을 실제 정수로 바꾸세요. 네이티브 통계 파일을 자동 변환하는 기능은 아닙니다.</p><form id="batchTrafficForm"><div class="field" style="margin-top:16px"><label for="batchTrafficData">월별 기록 JSON</label><textarea id="batchTrafficData" style="min-height:260px" required>${esc(JSON.stringify(example,null,2))}</textarea></div><div class="help">플랫폼: blog / insta / youtube. 관심 주제 ID는 비워 두면 미분류입니다. 동일 키가 이미 있으면 전체 가져오기를 중단합니다.</div><div class="modalfooter"><button type="submit" class="btn primary">검증 후 추가</button></div></form>`)}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.analysisChannel){analysisChannel=t.dataset.analysisChannel;analysisMetric=Object.keys(MEASURES[analysisChannel])[0];analysisMonth='all';analysisSearch='';render();return}if(t.dataset.toggleTopic){const topic=db.interests.find(t1=>t1.id===t.dataset.toggleTopic);if(topic){setTopicPreference(topic,t.dataset.topicChannel||currentTopicChannel());persist();const isModal=!!$('#modalRoot').firstChild;render();if(isModal)interestModal()}return}if(t.dataset.renameTopic){const topic=db.interests.find(t1=>t1.id===t.dataset.renameTopic);if(topic){modal(`<div class="modalhead"><h2 id="modalTitle">관심 주제 이름 수정</h2><button class="close" data-action="close" aria-label="닫기">×</button></div><form id="renameTopicForm" data-id="${esc(topic.id)}"><div class="field"><label for="renameTopicName">주제 이름</label><input class="input" id="renameTopicName" required maxlength="100" value="${esc(topic.name)}"></div><div class="modalfooter"><button type="submit" class="btn primary">저장</button></div></form>`)}return}if(t.dataset.trafficSource){trafficSources(t.dataset.trafficSource);return}if(t.dataset.trafficEdit){trafficModal(t.dataset.trafficEdit);return}if(t.dataset.trafficIdea){const r=db.traffic.find(r=>r.id===t.dataset.trafficIdea);if(r)addAnalyticalIdea(r);return}if(t.dataset.topicIdea){const topic=db.interests.find(x=>x.id===t.dataset.topicIdea);if(topic)addAnalyticalIdea(null,topic);return}switch(t.dataset.action){case'newTraffic':trafficModal();break;case'manageInterests':interestModal();break;case'batchTraffic':batchTrafficModal();break;case'exportTraffic':download('fieldnote-evidence.json',JSON.stringify({scope:analysisScope(),favoriteOnly:analysisOnlyFavorite,search:analysisSearch,method:'동일 플랫폼·지표·검색어의 서로 겹치지 않는 월별 횟수 합산. 미입력은 제외. 전체 시장 수요 및 매출 추정 아님.',rows:analysisRows(),interests:db.interests},null,2),'application/json');toast('현재 조건의 근거를 내보냈습니다.');break}});
document.addEventListener('change',e=>{switch(e.target.id){case'analysisMetric':analysisMetric=e.target.value;render();break;case'analysisMonth':analysisMonth=e.target.value;render();break;case'analysisSort':analysisSort=e.target.value;render();break;case'analysisOnlyFavorite':analysisOnlyFavorite=e.target.checked;render();break;case'trafficChannel':{const c=e.target.value;$('#trafficMetric').innerHTML=Object.entries(MEASURES[c]).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('');break}}});
document.addEventListener('input',e=>{if(e.target.id==='analysisSearch'){analysisSearch=e.target.value;render();$('#analysisSearch').focus()}});

'1~2,000개 기록의 배열을 입력하세요.');const records=incoming.map(r=>({...r,id:uid(),updated:Date.now(),topicId:r.topicId||null}));if(records.some(r=>!validRecord(r)||r.topicId!==null&&!db.interests.some(t=>t.id===r.topicId)))throw Error('기록의 값·플랫폼·지표·주제 ID·출처를 확인하세요.');const keys=[...db.traffic,...records].map(measurementKey);if(new Set(keys).size!==keys.length)throw Error('기존 기록 또는 입력 안에 중복된 월·플랫폼·지표·검색어가 있습니다.');db.traffic.push(...records);log('유입 기록 '+records.length+'건 추가');persist();closeModal();render();toast(records.length+'건을 추가했습니다.')}catch(err){toast('가져오기 실패: '+err.message)}}});

let storageOK=true;function validate(x){if(!x||x.version!==1||!Array.isArray(x.ideas)||!Array.isArray(x.posts)||!Array.isArray(x.activity)||!x.profile||typeof x.profile.name!=='string'||typeof x.profile.tone!=='string')throw Error('형식을 확인하세요.');if(x.posts.some(p=>!p||typeof p.id!=='string'||typeof p.title!=='string'||typeof p.body!=='string'||typeof p.sources!=='string'||!CH[p.channel]||!STATUS[p.status]||!Array.isArray(p.checks)||p.checks.length!==3||p.checks.some(c=>typeof c!=='boolean')||(p.status==='approved'&&!p.checks.every(Boolean))))throw Error('원고 형식이 맞지 않습니다.');if(x.ideas.some(i=>!i||typeof i.id!=='string'||typeof i.title!=='string'||typeof i.note!=='string'||typeof i.sources!=='string'))throw Error('소재 형식이 맞지 않습니다.');if(x.activity.some(a=>!a||typeof a.text!=='string'||!Number.isFinite(a.at)))throw Error('활동 기록 형식이 맞지 않습니다.');if(new Set(x.posts.map(p=>p.id)).size!==x.posts.length||new Set(x.ideas.map(i=>i.id)).size!==x.ideas.length)throw Error('중복 ID가 있습니다.');return validateAnalytics(x);}
let db;try{const raw=localStorage.getItem(KEY);db=raw?validate(JSON.parse(raw)):initial();}catch(e){db=initial();storageOK=false;}

function log(t){db.activity.unshift({text:t,at:Date.now()});db.activity=db.activity.slice(0,60)}
function relative(at){const min=Math.floor((Date.now()-at)/60000);return min<1?'방금':min<60?min+'분 전':min<1440?Math.floor(min/60)+'시간 전':Math.floor(min/1440)+'일 전'}
function icon(c){return `<span class="channelicon ${c}">${CH[c].icon}</span>`}function badge(p){return `<span class="badge ${p.status}">${STATUS[p.status]}</span>`}function sample(p){return p.sample?'<span class="sampletag">예시</span>':''}
function head(title,desc,action=true){return `<div class="heading"><div><div class="eyebrow">YOUR PERSPECTIVE, IN PROGRESS</div><h1>${title}</h1><p class="subtitle">${desc}</p></div>${action?'<div class="actions"><button class="btn ghost" data-action="backup">↓ 백업</button><button class="btn primary" data-action="newIdea">＋ 새 소재</button></div>':''}</div>`}
function notice(){return `<div class="notice"><span style="color:var(--lime)">◉</span><span><strong>로컬 작업 모드</strong> · 편집·검수·파일 내보내기를 사용할 수 있습니다. AI 생성과 SNS 발행은 연결되지 않았습니다.</span><span class="tail">NO EXTERNAL CONNECTION</span></div>`}
function filteredPosts(){return db.posts.filter(p=>(filter==='all'||p.channel===filter)&&(!query||(p.title+' '+p.body).toLowerCase().includes(query.toLowerCase())))}
function toolbar(){return `<div class="toolbar"><div class="filters">${[['all','전체'],['blog','네이버'],['insta','인스타'],['youtube','유튜브']].map(([v,t])=>`<button class="filter ${filter===v?'active':''}" data-filter="${v}">${v!=='all'?`<span class="dot ${v}"></span>`:''}${t}</button>`).join('')}</div><div class="search"><input id="search" type="search" placeholder="제목·본문 검색" aria-label="제목·본문 검색" value="${esc(query)}"></div></div>`}
function reviewRows(posts){return posts.length?posts.map(p=>`<button class="reviewrow" data-edit="${esc(p.id)}">${icon(p.channel)}<div><div class="rowtitle">${esc(p.title)}${sample(p)}</div><div class="rowmeta">${CH[p.channel].name} · 출처 ${p.sources.split('\n').filter(s=>s.trim()).length}개 · ${relative(p.updated)} 수정</div></div>${badge(p)}<span class="chev">›</span></button>`).join(''):'<div class="empty">확인할 원고가 없습니다. 소재를 추가해 첫 원고를 만들어 보세요.</div>'}
function dashboard(){const posts=filteredPosts(),review=posts.filter(p=>p.status==='review'),approved=posts.filter(p=>p.status==='approved');return head('오늘의 스튜디오','경험을 기록하고, 근거를 더하고, 당신의 목소리로 발행하세요.')+notice()+`<div class="stats"><div class="stat"><div class="statlabel">전체 원고 <span>↗</span></div><div class="statvalue">${posts.length.toString().padStart(2,'0')}</div><small>채널별 제작 중인 콘텐츠</small></div><div class="stat"><div class="statlabel">검수 대기 <span>◷</span></div><div class="statvalue orange">${review.length.toString().padStart(2,'0')}</div><small>출처·경험·논지 확인 필요</small></div><div class="stat"><div class="statlabel">승인 완료 <span>✓</span></div><div class="statvalue green">${approved.length.toString().padStart(2,'0')}</div><small>내보내기 가능한 원고</small></div><div class="stat"><div class="statlabel">연결된 채널 <span>⌁</span></div><div class="statvalue">0<span style="font-size:16px;color:#58616e"> / 3</span></div><small>외부 발행 기능 연결 전</small></div></div>`+toolbar()+`<div class="sectionhead"><div class="left"><h2>확인이 필요한 원고</h2><span class="number">${review.length}</span></div><button class="linkbtn" data-view="review">모두 보기 ↗</button></div><div class="reviewlist">${reviewRows(review.slice(0,4))}</div><div class="sectionhead"><h2>채널별 작업</h2><span class="small">원고의 상태를 한눈에 확인하세요</span></div><div class="channels">${Object.keys(CH).filter(c=>filter==='all'||filter===c).map(c=>{const list=posts.filter(p=>p.channel===c);return `<div class="channelcard"><div class="cardhead"><div class="left">${icon(c)}<h3>${CH[c].name}</h3></div><span class="small">${list.length}개</span></div>${list.slice(0,3).map(p=>`<button class="channelrow" data-edit="${esc(p.id)}"><div class="title">${esc(p.title)}</div><div class="rowbottom">${badge(p)}<span class="small">${p.body.length.toLocaleString()}자 ↗</span></div></button>`).join('')||'<div class="empty">아직 원고가 없습니다.</div>'}<div class="cardfoot"><span>계정 미연결</span><button class="linkbtn" data-view="${c}">원고 보기 →</button></div></div>`}).join('')}</div><div class="bottomgrid"><div><div class="sectionhead"><h2>제작 워크플로우</h2><span class="small">수동 작업 · 로컬 저장</span></div><div class="panel"><div class="pipeline">${['경험 기록','자료 조사','원고 편집','검수·승인','내보내기'].map((s,i)=>`${i?'<span class="connector"></span>':''}<div class="step"><span class="stepnum">0${i+1}</span>${s}</div>`).join('')}</div><p class="panelnote">직접 경험과 외부 자료, 신앙적 해석을 구분해 기록합니다.</p></div></div><div><div class="sectionhead"><h2>최근 활동</h2><span class="small">이 브라우저의 기록</span></div><div class="panel">${db.activity.slice(0,3).map(a=>`<div class="activity"><span class="dot"></span><span>${esc(a.text)}</span><time>${relative(a.at)}</time></div>`).join('')||'<div class="small">활동이 없습니다.</div>'}</div></div></div>`}
function ideas(){return head('경험·소재함','직접 겪은 장면과 떠오른 질문을 먼저 기록하세요.')+`<div class="idea-grid">${db.ideas.map(i=>`<article class="idea"><div class="eyebrow" style="font-size:9px">FIELD NOTE · ${new Date(i.created).toLocaleDateString('ko-KR')}</div><h3 style="margin-top:10px">${esc(i.title)}${sample(i)}</h3><p>${esc(i.note)}</p><div class="small">참고 자료 ${i.sources.split('\n').filter(s=>s.trim()).length}개</div><div class="actions"><button class="btn primary" data-create="${esc(i.id)}">원고 틀 만들기</button><button class="btn ghost" data-idea-edit="${esc(i.id)}">수정</button><button class="btn ghost danger" data-idea-delete="${esc(i.id)}" aria-label="소재 삭제">×</button></div></article>`).join('')||'<div class="panel empty">새 소재 버튼으로 첫 경험을 기록하세요.</div>'}</div>`}
function postList(){const c=CH[view]?view:null;const posts=filteredPosts().filter(p=>c?p.channel===c:p.status==='review');return head(c?CH[c].name:'검수함',c?'원고를 편집하고 검수한 뒤 파일로 내보내세요.':'사실·출처·관점을 확인하고 다음 단계로 넘기세요.')+notice()+(c?topicSummary(c):'')+toolbar()+`<div class="draft-list">${posts.map(p=>`<div class="draftitem">${icon(p.channel)}<div class="grow"><h3>${esc(p.title)}${sample(p)}</h3><div class="small">${p.body.length.toLocaleString()}자 · ${relative(p.updated)} 수정</div></div>${badge(p)}<div class="actions"><button class="btn" data-edit="${esc(p.id)}">원고 열기 ↗</button><button class="btn ghost" data-export="${esc(p.id)}">↓</button></div></div>`).join('')||'<div class="panel empty">조건에 맞는 원고가 없습니다.</div>'}</div>`}
const checks=['직접 경험한 내용과 외부 자료를 구분했습니다.','수치·인용·사실의 출처를 확인했습니다.','개인의 해석과 집단 전체에 대한 일반화를 점검했습니다.'];
function editor(){const p=db.posts.find(p=>p.id===editing);if(!p){editing=null;return dashboard()}return head('원고 편집','저장 후 다른 화면으로 이동하세요. 원고 수정 시 기존 승인은 해제됩니다.',false)+`<div class="actions" style="margin-bottom:20px"><button class="btn ghost" data-action="back">← 목록으로</button>${badge(p)}${sample(p)}<span class="small" id="saveIndicator">저장된 원고</span></div><div class="editor-layout"><section class="panel"><div class="field"><label for="postTitle">제목</label><input class="input" id="postTitle" value="${esc(p.title)}" maxlength="200"></div><div class="field"><label for="postChannel">채널</label><select id="postChannel">${Object.keys(CH).map(c=>`<option value="${c}" ${p.channel===c?'selected':''}>${CH[c].name}</option>`).join('')}</select></div><div class="field"><label for="postBody">원고 · Markdown / 일반 텍스트</label><textarea id="postBody" style="min-height:350px">${esc(p.body)}</textarea><div class="charcount" id="charCount">${p.body.length.toLocaleString()}자</div></div><div class="field"><label for="postSources">출처 · 한 줄에 하나씩, URL과 메모</label><textarea id="postSources" placeholder="https://… — 자료 제목 / 확인 날짜">${esc(p.sources)}</textarea></div><div class="actions"><button class="btn primary" data-action="savePost">원고 저장</button><button class="btn" data-action="requestReview">검수함으로 보내기</button></div></section><section><div class="panel"><div class="sectionhead" style="margin-top:0"><h2>콘텐츠 미리보기</h2><span class="small">텍스트 미리보기</span></div><div class="preview"><h2 id="previewTitle">${esc(p.title)}</h2><div id="previewBody">${esc(p.body)}</div></div><div class="help">실제 SNS 편집기와 서식이 다를 수 있습니다.</div></div><div class="panel" style="margin-top:16px"><h2>발행 전 검수</h2>${checks.map((t,i)=>`<label class="checkrow"><input type="checkbox" data-check="${i}" ${p.checks[i]?'checked':''}><span>${t}</span></label>`).join('')}<div class="edit-toolbar"><button class="btn primary" data-action="approve">검수 완료 · 승인</button><button class="btn" data-action="exportCurrent">↓ Markdown</button></div><div class="warning">외부 계정에 게시하지 않습니다. 승인 상태만 저장합니다.</div></div><div class="actions" style="margin-top:16px;justify-content:flex-end"><button class="btn ghost danger" data-action="deletePost">원고 삭제</button></div></section></div>`}
function settings(){return head('설정·데이터','워크스페이스의 문체와 로컬 데이터를 관리하세요.',false)+`<div class="settingsgrid"><section class="panel"><h2>편집 기준</h2><div class="field"><label for="profileName">워크스페이스 이름</label><input class="input" id="profileName" maxlength="80" value="${esc(db.profile.name)}"></div><div class="field"><label for="profileTone">내 문체와 편집 원칙</label><textarea id="profileTone" style="min-height:150px">${esc(db.profile.tone)}</textarea><div class="help">원고 틀과 작업 패키지에 포함됩니다. AI에는 자동 전달되지 않습니다.</div></div><button class="btn primary" data-action="saveSettings">설정 저장</button></section><section class="panel"><h2>외부 연결</h2>${Object.keys(CH).map(c=>`<div class="connection">${icon(c)}<div class="grow"><h3>${CH[c].name}</h3><div class="small">로그인·발행 연결부 구현 필요</div></div><span class="statuspill">미연결</span></div>`).join('')}<p class="help">이 파일에는 비밀번호나 API 키를 입력하지 않습니다. 실제 AI 생성·수집·예약·발행은 별도 실행 프로그램이 필요합니다.</p></section><section class="panel"><h2>백업과 복원</h2><p class="subtitle">소재·원고·설정을 JSON 파일로 보관합니다.</p><div class="actions" style="margin-top:18px"><button class="btn" data-action="backup">↓ JSON 백업</button><button class="btn" data-action="import">↑ JSON 복원</button></div><p class="help">브라우저·파일 위치에 따라 저장 공간이 달라질 수 있습니다. 복원 시 현재 데이터를 교체합니다. 개인 메모가 포함되므로 백업은 직접 보관하세요.</p></section><section class="panel"><h2>예시 데이터</h2><p class="subtitle">처음 제공된 예시 소재와 예시 원고만 삭제합니다.</p><div class="actions" style="margin-top:18px"><button class="btn danger" data-action="clearSamples">예시 데이터 지우기</button></div><p class="help">직접 추가한 소재와 원고는 유지됩니다.</p></section></div>`}
function render(){document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.view===view));$('#breadcrumb').textContent=editing?'원고 편집':({dashboard:'운영 현황',review:'검수함',ideas:'경험·소재함',settings:'설정·데이터',analytics:'키워드·주제',research:'공개 조사 결과',topics:'채널별 관심 주제',...Object.fromEntries(Object.entries(CH).map(([k,v])=>[k,v.name]))})[view];$('#reviewCount').textContent=db.posts.filter(p=>p.status==='review').length;$('.workspace').firstChild.textContent=db.profile.name;$('#storageState').textContent=storageOK?'이 브라우저에 저장':'저장 불가 · JSON 백업 필요';$('#content').innerHTML=(editing?editor():view==='dashboard'?dashboard():view==='ideas'?ideas():view==='settings'?settings():view==='analytics'?analytics():view==='research'?publicResearch():view==='topics'?topicsPage():postList())+`<footer class="footer"><span>FIELDNOTE STUDIO / LOCAL EDITION</span><span>경험은 당신에게서, 근거는 원문에서.</span></footer>`;}
function canLeave(){return !dirty||confirm('저장하지 않은 수정이 있습니다. 버리고 이동할까요?')}
function navigate(v){if(!canLeave())return;view=v;editing=null;dirty=false;filter='all';query='';$('#sidebar').classList.remove('open');render();window.scrollTo(0,0)}
function openPost(id){if(!canLeave())return;editing=id;dirty=false;render();window.scrollTo(0,0)}
let oldFocus=null;
function modal(html){oldFocus=document.activeElement;$('#modalRoot').innerHTML=`<div class="modalback"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">${html}</section></div>`;$('#modalRoot').querySelector('input,button,textarea,select')?.focus()}
function closeModal(){$('#modalRoot').innerHTML='';oldFocus?.focus()}
function ideaModal(id){const i=db.ideas.find(i=>i.id===id);modal(`<div class="modalhead"><div><div class="eyebrow">NEW FIELD NOTE</div><h2 id="modalTitle">${i?'소재 수정':'경험을 기록하세요'}</h2></div><button class="close" data-action="close" aria-label="닫기">×</button></div><form id="ideaForm" data-id="${esc(id||'')}"><div class="field"><label for="ideaTitle">소재 제목</label><input id="ideaTitle" class="input" required maxlength="200" placeholder="어떤 장면이나 질문에서 시작하나요?" value="${esc(i?.title||'')}"></div><div class="field"><label for="ideaNote">경험과 생각</label><textarea id="ideaNote" required style="min-height:160px" placeholder="언제 / 어디서 / 직접 본 것 / 느낀 점 / 확인하고 싶은 것">${esc(i?.note||'')}</textarea></div><div class="field"><label for="ideaSources">참고 링크·자료</label><textarea id="ideaSources" placeholder="한 줄에 하나씩 기록하세요.">${esc(i?.sources||'')}</textarea></div><p class="help">입력한 내용은 이 브라우저에만 저장됩니다.</p><div class="modalfooter"><button type="button" class="btn ghost" data-action="close">취소</button><button class="btn primary" type="submit">${i?'변경 저장':'소재 저장'}</button></div></form>`)}
function createModal(id){modal(`<div class="modalhead"><h2 id="modalTitle">어떤 원고를 만들까요?</h2><button class="close" data-action="close" aria-label="닫기">×</button></div><form id="createForm" data-id="${esc(id)}"><div class="field"><label for="createChannel">제작할 채널</label><select id="createChannel">${Object.keys(CH).map(c=>`<option value="${c}" ${db.ideas.find(i=>i.id===id)?.preferredChannel===c?'selected':''}>${CH[c].name}</option>`).join('')}</select></div><p class="subtitle">메모와 출처를 넣은 편집용 원고 틀을 만듭니다. AI가 글이나 이미지를 생성하는 기능은 아닙니다.</p><div class="modalfooter"><button class="btn primary" type="submit">원고 틀 만들기</button></div></form>`)}
function template(i,c){const base=`## 작업 메모\n${i.note}\n\n## 채널 관심 주제\n${favoriteTopics(c).map(t=>t.name).join(' · ')}\n\n## 문체·편집 기준\n${db.profile.tone}\n\n`;const structures={blog:'## 직접 본 장면\n[메모를 바탕으로 경험을 작성하세요.]\n\n## 확인한 배경\n[원문과 근거를 확인해 작성하세요.]\n\n## 기독교 관점의 비교·비평\n[교리, 타인의 주장, 나의 해석을 구분하세요.]\n\n## 한국과 비교할 때의 한계\n[제도·역사·사회적 맥락의 차이를 적으세요.]\n\n## 한국에 던지는 질문\n[근거가 뒷받침하는 질문으로 마무리하세요.]',insta:'1장 · 핵심 질문\n[짧고 구체적인 질문]\n\n2장 · 직접 본 장면\n[경험과 관찰]\n\n3장 · 배경 사실\n[확인된 근거]\n\n4장 · 설명·논평\n[확인된 사실과 내 해석 구분]\n\n5장 · 맥락과 한계\n[전후 상황과 아직 확인되지 않은 것]\n\n6장 · 독자에게 던지는 질문\n[마무리]\n\n캡션\n[본문 요약과 출처 안내]',youtube:'00–05초 · 사건·장면 소개\n[확인한 핵심 상황]\n\n05–20초 · 맥락\n[원본 영상·발생지·날짜·등장인물 확인]\n\n20–40초 · 장면과 해설\n[사실·인용·내 논평을 구분]\n\n40–55초 · 결과와 반전\n[확인된 후속 결과 / 모르면 미확인 표시]\n\n55–60초 · 마무리\n[핵심 정리]\n\n제작 확인\n[원본 영상 사용 권리·허락·개인정보·재연 여부 확인]\n\n설명란\n[원본 출처·추가 맥락·정정 안내]'};return base+structures[c]}
function saveEditor(target){const p=db.posts.find(p=>p.id===editing);if(!p)return false;const title=$('#postTitle').value.trim(),body=$('#postBody').value,sources=$('#postSources').value,channel=$('#postChannel').value;if(!title){toast('제목을 입력하세요.');$('#postTitle').focus();return false}const changed=p.title!==title||p.body!==body||p.sources!==sources||p.channel!==channel;const checkValues=Array.from(document.querySelectorAll('[data-check]')).map(el=>el.checked);if(target==='approved'&&!checkValues.every(Boolean)){toast('검수 항목 3개를 모두 확인하세요.');return false}if(target==='approved'&&!body.trim()){toast('원고를 작성하세요.');return false}p.title=title;p.body=body;p.sources=sources;p.channel=channel;p.checks=checkValues;p.status=target||(p.status==='approved'&&(changed||!checkValues.every(Boolean))?'draft':p.status);p.updated=Date.now();log(target==='approved'?'원고 검수 승인: '+title:target==='review'?'검수 요청: '+title:'원고 저장: '+title);persist();dirty=false;render();toast(target==='approved'?'승인 완료. 외부 게시물은 발행하지 않았습니다.':target==='review'?'검수함으로 보냈습니다.':'원고를 저장했습니다.');return true}
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function exportPost(id){const p=db.posts.find(p=>p.id===id);if(!p)return;download(p.title.replace(/[\\/:*?"<>|]/g,'_').slice(0,90)+'.md',`# ${p.title}\n\n${p.body}\n\n---\n\n## 출처\n${p.sources||'미입력'}\n\n작업 상태: ${STATUS[p.status]} / 채널: ${CH[p.channel].name}\n`,'text/markdown;charset=utf-8');toast('Markdown 파일을 내보냈습니다.')}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.view){navigate(t.dataset.view);return}if(t.dataset.filter){filter=t.dataset.filter;render();return}if(t.dataset.edit){openPost(t.dataset.edit);return}if(t.dataset.create){createModal(t.dataset.create);return}if(t.dataset.ideaEdit){ideaModal(t.dataset.ideaEdit);return}if(t.dataset.ideaDelete){if(confirm('이 소재를 삭제할까요? 연결된 원고는 유지됩니다.')){db.ideas=db.ideas.filter(i=>i.id!==t.dataset.ideaDelete);log('소재를 삭제했습니다');persist();render()}return}if(t.dataset.export){exportPost(t.dataset.export);return}switch(t.dataset.action){case'newIdea':ideaModal();break;case'close':closeModal();break;case'back':navigate(CH[view]?view:'dashboard');break;case'savePost':saveEditor();break;case'requestReview':saveEditor('review');break;case'approve':saveEditor('approved');break;case'exportCurrent':if(saveEditor())exportPost(editing);break;case'backup':download('fieldnote-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,2),'application/json');toast('워크스페이스 백업을 내보냈습니다.');break;case'import':$('#importFile').click();break;case'saveSettings':{const name=$('#profileName').value.trim();if(!name){toast('워크스페이스 이름을 입력하세요.');return}db.profile={name,tone:$('#profileTone').value};log('편집 기준을 저장했습니다');persist();render();toast('설정을 저장했습니다.');break}case'clearSamples':if(confirm('예시로 표시된 소재와 원고만 삭제할까요?')){db.ideas=db.ideas.filter(i=>!i.sample);db.posts=db.posts.filter(p=>!p.sample);log('예시 데이터를 지웠습니다');persist();render();toast('예시 데이터를 지웠습니다.')}break;case'deletePost':if(confirm('이 원고를 삭제할까요? 삭제 후 되돌릴 수 없습니다.')){db.posts=db.posts.filter(p=>p.id!==editing);log('원고를 삭제했습니다');persist();dirty=false;editing=null;render()}break;}});
document.addEventListener('submit',e=>{if(e.target.id==='ideaForm'){e.preventDefault();const f=e.target,id=f.dataset.id,old=db.ideas.find(i=>i.id===id),title=$('#ideaTitle').value.trim(),note=$('#ideaNote').value.trim(),sources=$('#ideaSources').value;if(!title||!note){toast('제목과 경험 메모를 입력하세요.');return}if(old)Object.assign(old,{title,note,sources});else db.ideas.unshift({id:uid(),title,note,sources,created:Date.now(),sample:false});log((old?'소재 수정: ':'새 소재: ')+title);persist();closeModal();navigate('ideas');toast('소재를 저장했습니다.')}if(e.target.id==='createForm'){e.preventDefault();if(!canLeave())return;const i=db.ideas.find(i=>i.id===e.target.dataset.id),channel=$('#createChannel').value;if(!i)return;const p={id:uid(),ideaId:i.id,title:i.title,channel,body:template(i,channel),sources:i.sources,status:'draft',checks:[false,false,false],sample:!!i.sample,created:Date.now(),updated:Date.now()};db.posts.unshift(p);log(CH[channel].short+' 원고 틀 생성: '+i.title);persist();closeModal();dirty=false;editing=p.id;view=channel;render();toast('편집용 원고 틀을 만들었습니다.')}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;const pos=e.target.selectionStart;render();$('#search').focus();try{$('#search').setSelectionRange(pos,pos)}catch(_){}return}if(['postTitle','postBody','postSources','postChannel'].includes(e.target.id)){document.querySelectorAll('[data-check]').forEach(el=>el.checked=false);dirty=true;$('#saveIndicator').textContent='저장되지 않은 변경';$('#saveIndicator').style.color='var(--orange)';$('#previewTitle').textContent=$('#postTitle').value;$('#previewBody').textContent=$('#postBody').value;$('#charCount').textContent=$('#postBody').value.length.toLocaleString()+'자';}});
document.addEventListener('change',e=>{if(e.target.matches('[data-check]')){dirty=true;$('#saveIndicator').textContent='저장되지 않은 변경'}});
$('#importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>10000000)throw Error('백업은 10MB 이하만 불러올 수 있습니다.');const incoming=validate(JSON.parse(await file.text()));if(confirm('백업으로 현재 소재·원고·설정을 교체할까요? 먼저 JSON 백업을 권장합니다.')){db=incoming;log('JSON 백업을 복원했습니다');persist();dirty=false;editing=null;view='dashboard';filter='all';query='';render();toast('백업을 복원했습니다.')}}catch(err){toast('복원 실패: '+err.message)}e.target.value=''});
document.addEventListener('keydown',e=>{if($('#modalRoot').firstChild){if(e.key==='Escape')closeModal();if(e.key==='Tab'){const all=Array.from($('#modalRoot').querySelectorAll('button,input,textarea,select,[tabindex="0"]')).filter(el=>!el.disabled);if(e.shiftKey&&document.activeElement===all[0]){e.preventDefault();all.at(-1)?.focus()}else if(!e.shiftKey&&document.activeElement===all.at(-1)){e.preventDefault();all[0]?.focus()}}}if((e.metaKey||e.ctrlKey)&&e.key==='s'&&editing){e.preventDefault();saveEditor()}});
/* Publish bridge: a browser-side queue. Platform credentials remain in a separate bridge. */
const publishStyle=document.createElement('style');publishStyle.textContent='.publish-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.publish-card{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:18px}.publish-card h3{margin:10px 0 6px}.publish-card p{color:var(--muted);font-size:11px;min-height:35px}.publish-card .actions{margin-top:15px}.publish-status{display:flex;gap:8px;align-items:center;font-size:10px;color:var(--muted)}.publish-status .dot{background:var(--orange)}.publish-status.ready .dot{background:var(--green)}.queue-row{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.queue-row:last-child{border:0}.bridge-note{border-left:3px solid var(--orange);padding:10px 12px;background:#1d1a14;color:#cfc4ac;font-size:11px;margin-top:15px}@media(max-width:1150px){.publish-grid{grid-template-columns:1fr}}@media(max-width:760px){.queue-row{grid-template-columns:30px 1fr}.queue-row .actions,.queue-row>.statuspill{grid-column:2}}';document.head.append(publishStyle);
function ensurePublish(){if(!db.integrations||typeof db.integrations!=='object')db.integrations={};Object.keys(CH).forEach(c=>{const x=db.integrations[c];if(!x||typeof x!=='object')db.integrations[c]={endpoint:'',token:'',checkedAt:0};});db.posts.forEach(p=>{if(!p.publish||typeof p.publish!=='object')p.publish={state:'not_requested',requestedAt:0,url:'',message:''};});}
function isConnected(c){return /^https?:\/\//.test(db.integrations?.[c]?.endpoint||'')}
function publishState(p){return p.publish?.state==='published'?'게시됨':p.publish?.state==='sending'?'전송 중':p.publish?.state==='failed'?'전송 실패':p.publish?.state==='queued'?'발행 대기':'미요청'}
function autoPlan(id){const i=db.ideas.find(x=>x.id===id);if(!i)return;const added=[];Object.keys(CH).forEach(c=>{const p={id:uid(),ideaId:i.id,title:i.title,channel:c,body:template(i,c),sources:i.sources,status:'draft',checks:[false,false,false],sample:false,created:Date.now(),updated:Date.now(),publish:{state:'not_requested',requestedAt:0,url:'',message:''}};db.posts.unshift(p);added.push(CH[c].short)});log('3채널 작업 묶음 생성: '+i.title);persist();render();toast(added.join(' · ')+' 초안을 만들었습니다.');}
function publishing(){const approved=db.posts.filter(p=>p.status==='approved'&&!p.sample),all=db.posts.filter(p=>p.publish?.state==='published'||p.publish?.state==='queued'||p.publish?.state==='failed');return head('발행 센터','승인된 원고만 계정별 발행 브리지로 보냅니다. 브리지가 실제 플랫폼 API·로그인을 담당합니다.',false)+`<div class="publish-grid">${Object.keys(CH).map(c=>`<section class="publish-card">${icon(c)}<h3>${CH[c].name}</h3><p>${c==='youtube'?'영상 파일과 OAuth 업로드 권한이 필요합니다.':'공식 계정 연결 또는 별도 발행 브리지가 필요합니다.'}</p><div class="publish-status ${isConnected(c)?'ready':''}"><span class="dot"></span>${isConnected(c)?'브리지 주소 설정됨':'브리지 미연결'}</div><div class="actions"><button class="btn ${isConnected(c)?'':'primary'}" data-action="configureConnection" data-channel="${c}">${isConnected(c)?'연결 설정':'연결하기'}</button><button class="btn ghost" data-action="checkConnection" data-channel="${c}" ${isConnected(c)?'':'disabled'}>상태 확인</button></div></section>`).join('')}</div><div class="sectionhead"><div class="left"><h2>승인된 발행 대기열</h2><span class="number">${approved.length}</span></div><span class="small">예시 원고는 발행할 수 없습니다.</span></div><section class="panel">${approved.map(p=>`<div class="queue-row">${icon(p.channel)}<div><h3>${esc(p.title)}</h3><div class="small">${CH[p.channel].name} · ${p.sources.trim()?p.sources.split('\n').filter(Boolean).length+'개 출처':'출처 미입력'} · ${publishState(p)}</div>${p.publish?.message?`<div class="warning">${esc(p.publish.message)}</div>`:''}</div><span class="statuspill">${publishState(p)}</span><div class="actions"><button class="btn ${isConnected(p.channel)?'primary':'ghost'}" data-publish="${esc(p.id)}" ${isConnected(p.channel)?'':'disabled'}>승인 후 올리기</button><button class="btn ghost" data-export="${esc(p.id)}">↓</button></div></div>`).join('')||'<div class="empty">검수 승인된 실제 원고가 없습니다. 원고 편집 화면에서 세 항목을 확인한 뒤 승인하세요.</div>'}</section><div class="bridge-note"><strong>실제 자동 발행의 경계</strong><br>이 화면은 승인 게이트와 전송 요청을 처리합니다. 비밀번호·OAuth 비밀값은 이 HTML에 저장하지 않습니다. 각 플랫폼 API 권한을 보관하는 발행 브리지 URL을 연결해야 실제 게시가 됩니다.</div>${all.length?`<div class="sectionhead"><h2>최근 발행 요청</h2></div><section class="panel">${all.slice(0,8).map(p=>`<div class="queue-row">${icon(p.channel)}<div><h3>${esc(p.title)}</h3><div class="small">${p.publish?.requestedAt?new Date(p.publish.requestedAt).toLocaleString('ko-KR'):'—'}</div></div><span class="statuspill">${publishState(p)}</span>${p.publish?.url?`<a class="btn" href="${esc(p.publish.url)}" target="_blank" rel="noopener">게시물 열기</a>`:'<span></span>'}</div>`).join('')}</section>`:''}`}
function connectionModal(c){const x=db.integrations[c];const note=c==='youtube'?'YouTube Data API OAuth 업로드 권한과 영상 파일 전달을 브리지에서 처리하세요.':c==='insta'?'Instagram Graph API의 Business/Creator 권한 및 공개 미디어 URL을 브리지에서 처리하세요.':'네이버 블로그는 현재 공개 개발자 목록에서 일반 블로그 글쓰기 API가 확인되지 않았습니다. 본인 로그인 세션을 보관하는 개인용 브리지를 별도 구현하세요.';modal(`<div class="modalhead"><h2 id="modalTitle">${CH[c].name} 발행 연결</h2><button class="close" data-action="close" aria-label="닫기">×</button></div><p class="subtitle">발행 브리지는 승인된 원고 JSON을 받아 실제 플랫폼 API 또는 본인용 게시 자동화를 수행하는 별도 서비스입니다.</p><form id="connectionForm" data-channel="${c}"><div class="field"><label for="bridgeEndpoint">발행 브리지 URL</label><input class="input" id="bridgeEndpoint" type="url" required placeholder="https://publisher.example.com/publish/${c}" value="${esc(x.endpoint)}"><div class="help">POST 요청을 받고 CORS를 허용하는 본인 소유 HTTPS 주소를 입력하세요.</div></div><div class="field"><label for="bridgeToken">브리지 토큰 · 선택</label><input class="input" id="bridgeToken" type="password" autocomplete="off" placeholder="브리지에서 발급한 짧은 토큰" value="${esc(x.token)}"><div class="help">브라우저 로컬 저장소에 보관됩니다. 플랫폼 비밀번호·OAuth client secret은 입력하지 마세요.</div></div><p class="bridge-note">${note}</p><div class="modalfooter"><button type="button" class="btn ghost" data-action="close">취소</button><button class="btn primary" type="submit">연결 설정 저장</button></div></form>`)}
async function checkConnection(c){const endpoint=db.integrations[c].endpoint;if(!endpoint)return;try{const res=await fetch(endpoint,{method:'OPTIONS'});db.integrations[c].checkedAt=Date.now();persist();render();toast(res.ok?'브리지 응답을 받았습니다.':'브리지가 응답했지만 상태 코드 '+res.status+'입니다.')}catch(err){toast('연결 확인 실패: '+err.message)}}
async function sendToBridge(id){const p=db.posts.find(x=>x.id===id);if(!p||p.status!=='approved'||p.sample)return;if(!confirm(`‘${p.title}’을(를) ${CH[p.channel].name} 브리지로 전송할까요? 브리지가 실제 게시를 수행할 수 있습니다.`))return;const x=db.integrations[p.channel];if(!isConnected(p.channel)){toast('먼저 발행 브리지 URL을 설정하세요.');return}p.publish={state:'sending',requestedAt:Date.now(),url:'',message:''};persist();render();try{const payload={version:1,action:'publish',channel:p.channel,post:{id:p.id,title:p.title,body:p.body,sources:p.sources,approvedAt:p.updated},profile:{name:db.profile.name,tone:db.profile.tone}};const r=await fetch(x.endpoint,{method:'POST',headers:{'Content-Type':'application/json',...(x.token?{'X-Fieldnote-Token':x.token}:{})},body:JSON.stringify(payload)});const data=await r.json().catch(()=>({}));if(!r.ok||data.ok===false)throw Error(data.message||'HTTP '+r.status);p.publish={state:data.state==='queued'?'queued':'published',requestedAt:Date.now(),url:typeof data.url==='string'?data.url:'',message:typeof data.message==='string'?data.message:''};log(CH[p.channel].short+' 발행 요청 완료: '+p.title);toast(p.publish.state==='published'?'게시 완료 응답을 받았습니다.':'발행 대기 응답을 받았습니다.')}catch(err){p.publish={state:'failed',requestedAt:Date.now(),url:'',message:err.message};log(CH[p.channel].short+' 발행 요청 실패: '+p.title);toast('발행 요청 실패: '+err.message)}persist();render()}
function addPublishNav(){const anchor=document.querySelector('[data-view="topics"]');if(anchor&&!document.querySelector('[data-view="publish"]'))anchor.insertAdjacentHTML('afterend','<button class="nav" data-view="publish"><span class="navicon">⇧</span>발행 센터</button>')}
const oldRender=render;render=function(){ensurePublish();addPublishNav();if(view==='publish'){document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.view===view));$('#breadcrumb').textContent='발행 센터';$('#reviewCount').textContent=db.posts.filter(p=>p.status==='review').length;$('.workspace').firstChild.textContent=db.profile.name;$('#storageState').textContent=storageOK?'이 브라우저에 저장':'저장 불가 · JSON 백업 필요';$('#content').innerHTML=publishing()+`<footer class="footer"><span>FIELDNOTE STUDIO / LOCAL EDITION</span><span>승인은 당신이, 게시 권한은 플랫폼이.</span></footer>`;return}oldRender();if(view==='ideas')document.querySelectorAll('[data-create]').forEach(b=>{const id=b.dataset.create;if(!document.querySelector(`[data-action="autoPlan"][data-idea="${CSS.escape(id)}"]`))b.insertAdjacentHTML('afterend',`<button class="btn ghost" data-action="autoPlan" data-idea="${esc(id)}">3채널 자동 기획</button>`)});if(editing){const p=db.posts.find(x=>x.id===editing);if(p?.status==='approved'&&!p.sample){const bar=document.querySelector('.edit-toolbar');if(bar&&!bar.querySelector('[data-view="publish"]'))bar.insertAdjacentHTML('beforeend','<button class="btn" data-view="publish">발행 센터로</button>')}}};
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.publish){sendToBridge(t.dataset.publish);return}if(t.dataset.action==='configureConnection'){connectionModal(t.dataset.channel);return}if(t.dataset.action==='checkConnection'){checkConnection(t.dataset.channel);return}if(t.dataset.action==='autoPlan'){autoPlan(t.dataset.idea);return}});
document.addEventListener('submit',e=>{if(e.target.id==='connectionForm'){e.preventDefault();const c=e.target.dataset.channel,endpoint=$('#bridgeEndpoint').value.trim(),token=$('#bridgeToken').value.trim();try{new URL(endpoint)}catch(_){toast('유효한 브리지 URL을 입력하세요.');return}db.integrations[c]={endpoint,token,checkedAt:0};log(CH[c].short+' 발행 브리지 설정');persist();closeModal();render();toast('연결 설정을 저장했습니다. 상태 확인 후 승인 원고를 전송하세요.')}});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});$('#mobileMenu').onclick=()=>$('#sidebar').classList.toggle('open');$('#date').textContent=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Singapore',month:'long',day:'numeric',weekday:'short'}).format(new Date());ensureAnalytics(db);ensurePublish();render();if(storageOK)persist();
</script></body></html>
