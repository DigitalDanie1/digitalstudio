function migrateBlogTopics(x,stripOld){
 for(const t of stripOld?x.interests:[]){if(!t||typeof t!=='object'||!OLD_BLOG_SEED_IDS.includes(t.id))continue;if(Array.isArray(t.channels))t.channels=t.channels.filter(c=>c!=='blog');if(t.channelFavorites&&typeof t.channelFavorites==='object')delete t.channelFavorites.blog}
 for(const c of NAVER_POSTABLE){const id='nv-'+c.id;if(x.interests.some(t=>t?.id===id))continue;x.interests.push({id,name:c.name,note:c.note,channels:['blog'],favorite:true,channelFavorites:{},naverCategory:c.name,parentCategory:naverParentName(c)})}
}
function migrateYoutubeV7(x){
 const stripYt=t=>{if(Array.isArray(t.channels))t.channels=t.channels.filter(c=>c!=='youtube');if(t.channelFavorites&&typeof t.channelFavorites==='object')delete t.channelFavorites.youtube};
 for(const t of x.interests){
  if(!t||typeof t!=='object')continue;
  if(YT_V7_BY_ID[t.id])continue;
  if(YT_BLOG_MOVE.includes(t.id))continue;

return head('키워드·주제','플랫폼의 실제 반응과 내가 다루고 싶은 주제를 함께 확인합니다.',false)+`<div class="analysis-hero"><span class="statuspill">수동 입력 기반 · 자동 수집 미연결</span><div class="actions"><button class="btn ghost" data-action="manageInterests">☆ 관심 주제</button><button class="btn ghost" data-action="batchTraffic">JSON 일괄 입력</button><button class="btn primary" data-action="newTraffic">＋ 유입 기록</button></div></div><div class="analysis-platforms">${Object.keys(CH).map(c=>`<button class="analysis-platform ${analysisChannel===c?'active':''}" data-analysis-channel="${c}"><div class="left">${icon(c)}<strong>${CH[c].name}</strong><span class="small" style="margin-left:auto">${db.traffic.filter(r=>r.channel===c).length}건 기록</span></div><p>${c==='blog'?'검색어별 실제 검색 유입 기록':c==='youtube'?'검색 유입 조회수와 주제별 조회수 구분':'검색어 추정 없이, 주제별 조회·저장·공유 기록'}</p></button>`).join('')}</div><div class="analysis-layout"><section><div class="analysis-controls"><div class="field"><label for="analysisMetric">분석 지표</label><select id="analysisMetric">${Object.entries(MEASURES[analysisChannel]).map(([k,v])=>`<option value="${k}" ${analysisMetric===k?'selected':''}>${v.label}</option>`).join('')}</select></div><div class="field"><label for="analysisMonth">관측 월</label><select id="analysisMonth"><option value="all">입력된 모든 월</option>${months.map(m=>`<option value="${m}" ${analysisMonth===m?'selected':''}>${m}</option>`).join('')}</select></div><div class="field"><label for="analysisSort">정렬</label><select id="analysisSort"><option value="value" ${analysisSort==='value'?'selected':''}>${metric.label} 높은 순</option><option value="alpha" ${analysisSort==='alpha'?'selected':''}>이름순</option></select></div></div><div class="toolbar"><label class="checkrow" style="margin:0"><input type="checkbox" id="analysisOnlyFavorite" ${analysisOnlyFavorite?'checked':''}>내 관심 주제만 보기</label><div class="search"><input type="search" id="analysisSearch" placeholder="검색어·주제 찾기" aria-label="검색어·주제 찾기" value="${esc(analysisSearch)}"></div></div><div class="analysis-mini"><div class="panel"><span class="small">${metric.kind==='search'?'검색어':'주제'} 수</span><strong>${groups.length}</strong><span class="small">현재 조건에 맞는 항목</span></div><div class="panel"><span class="small">관심 주제 교집합</span><strong style="color:var(--lime)">${matches.length}</strong><span class="small">기록 값이 0보다 큰 항목</span></div><div class="panel"><span class="small">관측 범위</span><strong>${observedMonthCount?observedMonthCount+'개월':'—'}</strong><span class="small">입력되지 않은 월은 제외</span></div></div>${rows.length?`<div class="analysis-callout">${matches.length?`<strong>관심 주제와 실측이 겹치는 항목 ${matches.length}개</strong><p>선택 지표가 가장 큰 항목: ‘${esc(matches[0].term)}’ · ${matches[0].value.toLocaleString()}${metric.unit}. 기록된 범위 안의 관측이며, 검색 시장 규모나 예상 매출을 뜻하지 않습니다.</p>`:'<strong>현재 조건에서 관심 주제와 겹치는 실측 항목이 없습니다.</strong><p>각 기록의 관심 주제 분류와 관심 설정을 확인하거나, 아래 조사 후보를 소재로 저장하세요.</p>'}</div><div class="analysis-table-wrap"><table class="analysis-table"><thead><tr><th>${metric.kind==='search'?'유입 검색어':'콘텐츠 주제'}</th><th>연결한 관심 주제</th><th style="text-align:right">${metric.label}</th><th>관측 월</th><th>근거·작업</th></tr></thead><tbody>${sorted.map(g=>{const topics=[...g.topicIds].map(id=>db.interests.find(t=>t.id===id)).filter(Boolean);return `<tr><td><strong>${esc(g.term)}</strong><div class="small">${g.rows.length}건 기록</div></td><td>${topics.length?topics.map(t=>`<div>${topicEnabled(t,analysisChannel)?'☆ ':''}${esc(t.name)}</div>`).join(''):'<span class="small">미분류</span>'}</td><td class="metric">${g.value.toLocaleString()}<span class="small"> ${metric.unit}</span></td><td>${[...new Set(g.rows.map(r=>r.month))].sort().map(esc).join('<br>')}</td><td><div class="actions"><button class="btn ghost" data-traffic-source="${esc(g.rows[0].id)}">근거</button><button class="btn" data-traffic-idea="${esc(g.rows[0].id)}">소재로</button></div></td></tr>`}).join('')}</tbody></table></div>`:`<div class="analysis-empty"><div style="font-size:29px;color:var(--lime);margin-bottom:10px">⌕</div><h3>${db.traffic.length?'현재 조건에 맞는 기록이 없습니다.':'아직 실제 유입 데이터가 없습니다.'}</h3><p>통계 화면에서 확인한 월별 값을 입력하면 검색어·주제별로 묶고, 관심 주제와 겹치는 기록을 찾아줍니다. 데이터가 없다는 뜻은 유입이 0이라는 뜻이 아닙니다.</p><button class="btn primary" data-action="newTraffic">첫 유입 기록 추가</button></div>`}<details class="analysis-notes"><summary>분석 기준과 플랫폼별 데이터 안내</summary><p><strong>현재 범위:</strong> ${esc(analysisScope())}. 검색·관심 주제 필터도 적용됩니다. 같은 검색어의 서로 겹치지 않는 월별 횟수만 더합니다. 플랫폼·지표 간 합산이나 종합 점수는 만들지 않습니다.</p><p><strong>입력 단위:</strong> 계정 하나의 월 전체 합계 × 검색어 또는 주제 × 지표입니다. 게시물별 값과 계정 합계를 중복 입력하지 마세요. 주제별 합계를 계산할 때 한 게시물을 여러 주제에 중복 배정하지 마세요. 진행 중인 월은 중간 집계일 수 있습니다.</p><p><strong>누락:</strong> 미입력 값은 0으로 대체하지 않습니다. 일부 검색어만 보고되는 통계는 전체 유입을 나타내지 않습니다. 플랫폼의 월 집계 시간대를 그대로 사용하며, 서로 다른 시간대의 월 경계를 일치시켰다고 가정하지 않습니다.</p><p><strong>네이버:</strong> 내 블로그 통계의 검색 유입 보고서를 확인해 검색어별 횟수를 입력하세요. 비율만 보이면 전체 값과 일치하는 분모 없이 횟수로 환산하지 마세요.</p><p><strong>유튜브:</strong> 검색 유입 조회수와 전체 주제별 조회수를 별도로 기록하세요. <a href="https://support.google.com/youtube/answer/12220281?hl=ko" target="_blank" rel="noopener noreferrer">YouTube 공식 실적 안내</a> · <a href="https://developers.google.com/youtube/reporting/v1/reports" target="_blank" rel="noopener noreferrer">검색어 보고의 제한</a></p><p><strong>인스타:</strong> 이 도구는 조회·저장·공유의 주제별 반응을 받으며, 해당 반응에서 실제 유입 검색어를 역추정하지 않습니다.</p><p><strong>추천 기준:</strong> 사용자가 연결한 관심 주제에 해당하고 선택 지표가 0보다 큰 항목을 표시합니다. 정렬은 같은 지표의 기록 값 순이며 인과관계·성장률·수익 가능성을 판단하지 않습니다. 같은 검색어의 월별 관심 분류가 다르면 함께 표시하며, 관심 주제에 연결된 월의 값이 0보다 클 때 교집합에 포함합니다. 데이터 없는 조사 후보는 별도로 구분합니다.</p><button class="btn ghost" data-action="exportTraffic">↓ 현재 조건의 근거 JSON</button></details></section><aside class="analysis-sidebar"><section class="panel"><div class="sectionhead" style="margin-top:0"><h2>내가 다루고 싶은 주제</h2><button class="linkbtn" data-action="manageInterests">편집 ↗</button></div><p class="small">대화에서 말한 관심사를 초기값으로 넣었습니다. 별을 눌러 분석 대상에서 켜고 끄세요.</p><div class="interest-chips">${topicsFor(analysisChannel).map(t=>`<button class="interest-chip ${topicEnabled(t,analysisChannel)?'':'off'}" data-toggle-topic="${esc(t.id)}" data-topic-channel="${analysisChannel}" aria-pressed="${topicEnabled(t,analysisChannel)}">${topicEnabled(t,analysisChannel)?'★':'☆'} ${esc(t.name)}</button>`).join('')||'<span class="small">관심 주제를 추가하세요.</span>'}</div></section><section class="panel" style="margin-top:16px"><h2>다음 조사 후보</h2><p class="small">편집용 제안 · 인기·유입이 검증된 결과가 아닙니다.</p>${favoriteTopics(analysisChannel).map(t=>`<div class="topic-card"><h3>${esc(t.name)}</h3><p>${analysisChannel==='blog'?'용어·배경·원문을 정리할 수 있는 질문을 찾아보세요.':analysisChannel==='insta'?'한 개념을 출처와 함께 설명하는 카드뉴스 소재로 기록하세요.':'직접 관찰과 근거를 구분해 설명할 질문을 기록하세요.'}</p><button class="btn ghost" data-topic-idea="${esc(t.id)}">조사 소재로 저장 ＋</button></div>`).join('')||'<p class="small">관심 주제를 켜면 조사 후보가 표시됩니다.</p>'}</section></aside></div>`}
function interestModal(){channelInterestModal()}
function trafficModal(id){const r=db.traffic.find(r=>r.id===id),c=r?.channel||analysisChannel;modal(`<div class="modalhead"><h2 id="modalTitle">${r?'유입 기록 수정':'월별 유입·반응 기록'}</h2><button class="close" data-action="close" aria-label="닫기">×</button></div><form id="trafficForm" data-id="${esc(id||'')}"><div class="form-grid"><div class="field"><label for="trafficChannel">플랫폼</label><select id="trafficChannel">${Object.keys(CH).map(k=>`<option value="${k}" ${c===k?'selected':''}>${CH[k].name}</option>`).join('')}</select></div><div class="field"><label for="trafficMonth">관측 월</label><input type="month" class="input" id="trafficMonth" value="${esc(r?.month||monthNow())}" required></div></div><div class="field"><label for="trafficMetric">기록 지표</label><select id="trafficMetric">${Object.entries(MEASURES[c]).map(([k,v])=>`<option value="${k}" ${(r?.metric||(c===analysisChannel?analysisMetric:Object.keys(MEASURES[c])[0]))===k?'selected':''}>${v.label}</option>`).join('')}</select></div><div class="field"><label for="trafficTerm">검색어 또는 콘텐츠 주제</label><input class="input" id="trafficTerm" required maxlength="200" value="${esc(r?.term||'')}" placeholder="통계에서 확인한 검색어나 직접 분류한 주제"></div><div class="form-grid"><div class="field"><label for="trafficValue">월 전체 횟수 · 정수</label><input type="number" class="input" id="trafficValue" min="0" max="9007199254740991" step="1" value="${r?r.value:''}" required placeholder="데이터 없으면 입력하지 마세요"></div><div class="field"><label for="trafficTopic">연결할 관심 주제</label><select id="trafficTopic"><option value="">미분류</option>${db.interests.map(t=>`<option value="${esc(t.id)}" ${r?.topicId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div></div><div class="field"><label for="trafficSource">근거 · 보고서명 / 원문 위치 / 집계 범위 / 확인 날짜</label><textarea id="trafficSource" required placeholder="예: 내 채널 통계 → 검색 유입, 해당 월 계정 전체 합계. 확인 날짜와 원문 위치를 적으세요.">${esc(r?.source||'')}</textarea></div><p class="help">동일 플랫폼·월·지표·검색어는 한 번만 기록합니다. 실제 통계를 옮겨 적는 기능이며 값의 진위를 자동 검증하지 않습니다.</p><div class="modalfooter"><button class="btn ghost" type="button" data-action="close">취소</button><button class="btn primary" type="submit">기록 저장</button></div></form>`)}
function trafficSources(id){const first=db.traffic.find(r=>r.id===id);if(!first)return;const rows=analysisRows().filter(r=>r.term.trim().toLowerCase()===first.term.trim().toLowerCase());modal(`<div class="modalhead"><h2 id="modalTitle">${esc(first.term)} · 근거</h2><button class="close" data-action="close" aria-label="닫기">×</button></div><p class="subtitle">${esc(analysisScope())} · 사용자 입력 자료</p>${rows.map(r=>`<div style="margin-top:18px"><div class="sectionhead"><strong>${esc(r.month)} · ${r.value.toLocaleString()}회</strong><button class="btn ghost" data-traffic-edit="${esc(r.id)}">수정</button></div><div class="source-block">${esc(r.source)}</div><div class="help">최종 입력: ${new Date(r.updated).toLocaleString('ko-KR')} · 관심 분류: ${esc(db.interests.find(t=>t.id===r.topicId)?.name||'미분류')}</div></div>`).join('')}<p class="help">위 월별 횟수를 합산합니다. 관측되지 않은 월은 계산에 추가하지 않습니다.</p>`)}
function addAnalyticalIdea(r,topic){const c=r?.channel||analysisChannel,name=r?.term||topic.name;const observed=r?analysisRows().filter(x=>x.term.trim().toLowerCase()===r.term.trim().toLowerCase()):[];const total=observed.reduce((sum,x)=>sum+x.value,0);const note=r?`[사용자 입력 통계에서 가져온 소재]\n플랫폼: ${CH[c].name}\n지표: ${MEASURES[c][r.metric].label}\n범위: ${analysisMonth==='all'?'입력된 모든 월':analysisMonth}\n기록 값: ${total}회\n연결 주제: ${[...new Set(observed.map(x=>db.interests.find(t=>t.id===x.topicId)?.name).filter(Boolean))].join(', ')||'미분류'}\n\n이 기록은 일부 유입·반응 자료이며 시장 전체 수요나 매출을 의미하지 않습니다.\n직접 경험: [본인이 작성]\n확인할 사실: [원문 조사]\n내 해석: [본인이 작성]`:`[관심 주제에서 만든 조사 후보 / 실측 인기 근거 없음]\n주제: ${topic.name}\n플랫폼: ${CH[c].name}\n\n직접 관찰한 사례가 있는가?\n용어와 제도를 설명하는 1차 자료는 무엇인가?\n다른 해석과 비교의 한계는 무엇인가?\n\n경험과 주장은 조사 후 직접 작성하세요.`;const i={id:uid(),title:name,note,sources:observed.map(x=>`${x.month} · ${x.source}`).join('\n\n'),created:Date.now(),sample:false};db.ideas.unshift(i);log('분석에서 소재 저장: '+name);persist();toast('경험·소재함에 저장했습니다.');}
function batchTrafficModal(){const example=[{channel:analysisChannel,month:monthNow(),metric:analysisMetric,term:'통계에서 확인한 검색어 또는 주제',value:null,topicId:null,source:'보고서명·집계 범위·확인 날짜'}];modal(`<div class="modalhead"><h2 id="modalTitle">유입 기록 일괄 입력</h2><button class="close" data-action="close" aria-label="닫기">×</button></div><p class="subtitle">아래 형식의 JSON 배열을 붙여 넣으세요. value의 null을 실제 정수로 바꾸세요. 네이티브 통계 파일을 자동 변환하는 기능은 아닙니다.</p><form id="batchTrafficForm"><div class="field" style="margin-top:16px"><label for="batchTrafficData">월별 기록 JSON</label><textarea id="batchTrafficData" style="min-height:260px" required>${esc(JSON.stringify(example,null,2))}</textarea></div><div class="help">플랫폼: blog / insta / youtube. 관심 주제 ID는 비워 두면 미분류입니다. 동일 키가 이미 있으면 전체 가져오기를 중단합니다.</div><div class="modalfooter"><button type="submit" class="btn primary">검증 후 추가</button></div></form>`)}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.analysisChannel){analysisChannel=t.dataset.analysisChannel;analysisMetric=Object.keys(MEASURES[analysisChannel])[0];analysisMonth='all';analysisSearch='';render();return}if(t.dataset.toggleTopic){const topic=db.interests.find(t1=>t1.id===t.dataset.toggleTopic);if(topic){setTopicPreference(topic,t.dataset.topicChannel||currentTopicChannel());persist();const isModal=!!$('#modalRoot').firstChild;render();if(isModal)interestModal()}return}if(t.dataset.renameTopic){const topic=db.interests.find(t1=>t1.id===t.dataset.renameTopic);if(topic){modal(`<div class="modalhead"><h2 id="modalTitle">관심 주제 이름 수정</h2><button class="close" data-action="close" aria-label="닫기">×</button></div><form id="renameTopicForm" data-id="${esc(topic.id)}"><div class="field"><label for="renameTopicName">주제 이름</label><input class="input" id="renameTopicName" required maxlength="100" value="${esc(topic.name)}"></div><div class="modalfooter"><button type="submit" class="btn primary">저장</button></div></form>`)}return}if(t.dataset.trafficSource){trafficSources(t.dataset.trafficSource);return}if(t.dataset.trafficEdit){trafficModal(t.dataset.trafficEdit);return}if(t.dataset.trafficIdea){const r=db.traffic.find(r=>r.id===t.dataset.trafficIdea);if(r)addAnalyticalIdea(r);return}if(t.dataset.topicIdea){const topic=db.interests.find(x=>x.id===t.dataset.topicIdea);if(topic)addAnalyticalIdea(null,topic);return}switch(t.dataset.action){case'newTraffic':trafficModal();break;case'manageInterests':interestModal();break;case'batchTraffic':batchTrafficModal();break;case'exportTraffic':download('fieldnote-evidence.json',JSON.stringify({scope:analysisScope(),favoriteOnly:analysisOnlyFavorite,search:analysisSearch,method:'동일 플랫폼·지표·검색어의 서로 겹치지 않는 월별 횟수 합산. 미입력은 제외. 전체 시장 수요 및 매출 추정 아님.',rows:analysisRows(),interests:db.interests},null,2),'application/json');toast('현재 조건의 근거를 내보냈습니다.');break}});
document.addEventListener('change',e=>{switch(e.target.id){case'analysisMetric':analysisMetric=e.target.value;render();break;case'analysisMonth':analysisMonth=e.target.value;render();break;case'analysisSort':analysisSort=e.target.value;render();break;case'analysisOnlyFavorite':analysisOnlyFavorite=e.target.checked;render();break;case'trafficChannel':{const c=e.target.value;$('#trafficMetric').innerHTML=Object.entries(MEASURES[c]).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('');break}}});
/* Search boxes: never re-render while an IME composition is in progress; apply on compositionend. */
const SEARCH_INPUTS={search:v=>{query=v},analysisSearch:v=>{analysisSearch=v}};
function applySearchInput(el){const id=el.id,pos=el.selectionStart;SEARCH_INPUTS[id](el.value);render();const n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}}
document.addEventListener('input',e=>{if(!Object.hasOwn(SEARCH_INPUTS,e.target.id)||e.isComposing)return;applySearchInput(e.target)});
document.addEventListener('compositionend',e=>{if(Object.hasOwn(SEARCH_INPUTS,e.target.id))applySearchInput(e.target)});
document.addEventListener('submit',e=>{if(e.target.id==='interestForm'){e.preventDefault();const name=$('#interestName').value.trim();if(!name)return;if(db.interests.some(t=>t.name.toLowerCase()===name.toLowerCase())){toast('이미 있는 주제입니다.');return}const c=$('#newInterestChannel')?.value||currentTopicChannel();db.interests.push({id:uid(),name,favorite:true,channels:[c],channelFavorites:{},...(c==='youtube'?{ytChannel:ytTab()}:{})});log('관심 주제 추가: '+name);persist();render();interestModal();toast('관심 주제를 추가했습니다.')}if(e.target.id==='renameTopicForm'){e.preventDefault();const name=$('#renameTopicName').value.trim(),topic=db.interests.find(t=>t.id===e.target.dataset.id);if(!name||!topic)return;if(db.interests.some(t=>t.id!==topic.id&&t.name.toLowerCase()===name.toLowerCase())){toast('이미 있는 주제 이름입니다.');return}topic.name=name;persist();closeModal();render();toast('관심 주제 이름을 저장했습니다.')}if(e.target.id==='trafficForm'){e.preventDefault();const old=db.traffic.find(r=>r.id===e.target.dataset.id);const row={id:old?.id||uid(),channel:$('#trafficChannel').value,month:$('#trafficMonth').value,metric:$('#trafficMetric').value,term:$('#trafficTerm').value.trim(),value:$('#trafficValue').value.trim()===''?null:Number($('#trafficValue').value),topicId:$('#trafficTopic').value||null,source:$('#trafficSource').value.trim(),updated:Date.now()};if(!validRecord(row)){toast('월·검색어·출처와 0 이상의 정수 값을 확인하세요.');return}if(db.traffic.some(r=>r.id!==row.id&&measurementKey(r)===measurementKey(row))){toast('같은 월·플랫폼·지표·검색어의 기록이 있습니다. 근거 화면에서 수정하세요.');return}if(old)Object.assign(old,row);else db.traffic.push(row);analysisChannel=row.channel;analysisMetric=row.metric;analysisMonth='all';analysisSearch='';log('유입 기록 저장: '+row.term);persist();closeModal();render();toast('유입 기록을 저장했습니다.')}if(e.target.id==='batchTrafficForm'){e.preventDefault();try{const raw=$('#batchTrafficData').value;if(raw.length>2000000)throw Error('한 번에 2MB 이하만 입력하세요.');const incoming=JSON.parse(raw);if(!Array.isArray(incoming)||!incoming.length||incoming.length>2000)throw Error('1~2,000개 기록의 배열을 입력하세요.');const records=incoming.map(r=>({...r,id:uid(),updated:Date.now(),topicId:r.topicId||null}));if(records.some(r=>!validRecord(r)||r.topicId!==null&&!db.interests.some(t=>t.id===r.topicId)))throw Error('기록의 값·플랫폼·지표·주제 ID·출처를 확인하세요.');const keys=[...db.traffic,...records].map(measurementKey);if(new Set(keys).size!==keys.length)throw Error('기존 기록 또는 입력 안에 중복된 월·플랫폼·지표·검색어가 있습니다.');db.traffic.push(...records);log('유입 기록 '+records.length+'건 추가');persist();closeModal();render();toast(records.length+'건을 추가했습니다.')}catch(err){toast('가져오기 실패: '+err.message)}}});

function publicResearch(){const rows=PUBLIC_RESEARCH.filter(r=>(researchPlatform==='all'||r.channel===researchPlatform)&&(!researchFavorites||db.interests.some(t=>t.id===r.topic&&Object.keys(CH).some(c=>topicEnabled(t,c)))));return head('공개 자료에서 찾은 주제','2026년 11월 3일 조사 · 공개 콘텐츠·제도 원문을 확인한 편집 후보입니다.',false)+`<div class="notice"><span>⌕</span><span><strong>조사 결과 9건</strong> · 계정 유입 분석과 별개입니다. 한국어 검색량·플랫폼 인기 순위·예상 매출은 확인되지 않았습니다.</span></div><div class="toolbar"><div class="filters">${[['all','전체'],['blog','네이버 후보'],['insta','인스타 후보'],['youtube','유튜브 사례']].map(([k,v])=>`<button class="filter ${researchPlatform===k?'active':''}" data-research-platform="${k}">${v}</button>`).join('')}</div><label class="checkrow"><input type="checkbox" id="researchFavorites" ${researchFavorites?'checked':''}>내 관심 주제만</label></div><div class="idea-grid">${rows.map(r=>`<article class="idea"><div class="actions" style="margin:0 0 12px">${icon(r.channel)}<span class="small">${CH[r.channel].name}</span></div><h3>${esc(r.title)}</h3><div class="interest-chips">${r.keywords.map(k=>`<span class="interest-chip">${esc(k)}</span>`).join('')}</div><div class="small" style="color:var(--orange)">${esc(r.evidence)}</div><p style="max-height:none">${esc(r.finding)}</p><details class="analysis-notes"><summary>확인 범위·원문 출처</summary><p>${esc(r.limit)}</p>${r.sources.map(([title,url])=>`<p><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(title)} ↗</a></p>`).join('')}</details><div class="actions"><button class="btn primary" data-public-idea="${r.id}">소재함에 저장 ＋</button></div></article>`).join('')||'<div class="panel empty">현재 관심 주제에 맞는 조사 결과가 없습니다.</div>'}</div><div class="panel" style="margin-top:20px"><h2>어디까지 조사했나</h2><p class="subtitle" style="margin-top:10px">네이버: 검색 결과에서 관련 한국어 보도와 공식 자료를 찾았지만 블로그 본문 수집이 제한됐습니다. 유튜브: 주제별 공개 영상과 게시일을 확인했습니다. 인스타: 공개 원문 검색이 제한돼 공식 계정 경로·외부 보도·공식 설명 자료로 후보를 정리했습니다. 같은 조사 수준으로 취급하지 않습니다.</p><p class="help">키워드는 원문에서 확인한 개념을 바탕으로 구성한 한국어 검색 후보입니다. 자동완성·월 let storageOK=true;function validate(x){if(!x||x.version!==1||!Array.isArray(x.ideas)||!Array.isArray(x.posts)||!Array.isArray(x.activity)||!x.profile||typeof x.profile.name!=='string'||typeof x.profile.tone!=='string'||(x.profile.blogVoice!==undefined&&typeof x.profile.blogVoice!=='string')||(x.profile.youtubeVoice!==undefined&&typeof x.profile.youtubeVoice!=='string')||(x.profile.youtubeFormat!==undefined&&!['shorts','long'].includes(x.profile.youtubeFormat))||(x.profile.weeklyFocus!=null&&!WEEKLY_IDS.includes(x.profile.weeklyFocus))||(x.profile.ytChannelTab!==undefined&&!ytValidCh(x.profile.ytChannelTab))||(x.ytChannels!==undefined&&(!Array.isArray(x.ytChannels)||x.ytChannels.some(c=>!c||!ytValidCh(c.id)||typeof c.name!=='string'||typeof c.voice!=='string'))))throw Error('형식을 확인하세요.');if(x.posts.some(p=>!p||typeof p.id!=='string'||typeof p.title!=='string'||typeof p.body!=='string'||typeof p.sources!=='string'||(p.memo!==undefined&&typeof p.memo!=='string')||(p.naverCategory!==undefined&&typeof p.naverCategory!=='string')||(p.aiDraft!==undefined&&typeof p.aiDraft!=='boolean')||(p.ytChannel!==undefined&&!ytValidCh(p.ytChannel))||!CH[p.channel]||!STATUS[p.status]||!Array.isArray(p.checks)||p.checks.length!==3||p.checks.some(c=>typeof c!=='boolean')||(p.status==='approved'&&!p.checks.every(Boolean))))throw Error('원고 형식이 맞지 않습니다.');if(x.ideas.some(i=>!i||typeof i.id!=='string'||typeof i.title!=='string'||typeof i.note!=='string'||typeof i.sources!=='string'||(i.ytChannel!==undefined&&!ytValidCh(i.ytChannel))))throw Error('소재 형식이 맞지 않습니다.');if(x.activity.some(a=>!a||typeof a.text!=='string'||!Number.isFinite(a.at)))throw Error('활동 기록 형식이 맞지 않습니다.');if(new Set(x.posts.map(p=>p.id)).size!==x.posts.length||new Set(x.ideas.map(i=>i.id)).size!==x.ideas.length)throw Error('중복 ID가 있습니다.');return validateAnalytics(x);}
let db;try{const raw=localStorage.getItem(KEY);db=raw?validate(JSON.parse(raw)):initial();}catch(e){db=initial();storageOK=false;}
let view='dashboard',filter='all',query='',editing=null,dirty=false;
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;$('#toasts').append(el);setTimeout(()=>el.remove(),4500)}
function persist(){let ok=true;try{localStorage.setItem(KEY,JSON.stringify(db));storageOK=true}catch(e){storageOK=false;ok=false;toast(cloud.on?'브라우저 캐시 저장에 실패했습니다. 클라우드에는 계속 저장합니다.':'브라우저 저장에 실패했습니다. JSON 백업으로 보관하세요.')}paintStorage();cloudDirty();return ok}
function log(t){db.activity.unshift({text:t,at:Date.now()});db.activity=db.activity.slice(0,60)}
function relative(at){const min=Math.floor((Date.now()-at)/60000);return min<1?'방금':min<60?min+'분 전':min<1440?Math.floor(min/60)+'시간 전':Math.floor(min/1440)+'일 전'}
function icon(c){return `<span class="channelicon ${c}">${CH[c].icon}</span>`}function badge(p){return `<span class="badge ${p.status}">${STATUS[p.status]}</span>`}function sample(p){return (p.sample?'<span class="sampletag">예시</span>':'')+(p.aiDraft?'<span class="sampletag ai">AI 초안</span>':'')}
function head(title,desc,action=true){return `<div class="heading"><div><div class="eyebrow">YOUR PERSPECTIVE, IN PROGRESS</div><h1>${title}</h1><p class="subtitle">${desc}</p></div>${action?'<div class="actions"><button class="btn ghost" data-action="backup">↓ 백업</button><button class="btn primary" data-action="newIdea">＋ 새 소재</button></div>':''}</div>`}
function notice(){return `<div class="notice"><span style="color:var(--lime)">◉</span><span><strong>로컬 작업 모드</strong> · 편집·검수·파일 내보내기를 사용할 수 있습니다. ${connectedCount()?`발행 브리지 ${connectedCount()}개가 설정되어 있습니다. 승인한 원고는 발행 센터에서 직접 전송하세요. AI 채팅용 프롬프트를 복사하고 결과를 붙여 넣어 원고를 작성합니다.`:'AI 채팅용 프롬프트를 복사하고 결과를 붙여 넣어 원고를 작성할 수 있습니다.'}</span><span class="tail">${connectedCount()?'BRIDGE CONFIGURED':'NO EXTERNAL CONNECTION'}</span></div>`}
function filteredPosts(){return db.posts.filter(p=>(filter==='all'||p.channel===filter)&&(!query||(p.title+' '+p.body).toLowerCase().includes(query.toLowerCase())))}
function toolbar(){return `<div class="toolbar"><div class="filters">${[['all','전체'],['blog','네이버'],['insta','인스타'],['youtube','유튜브']].map(([v,t])=>`<button class="filter ${filter===v?'active':''}" data-filter="${v}">${v!=='all'?`<span class="dot ${v}"></span>`:''}${t}</button>`).join('')}</div><div class="search"><input id="search" type="search" placeholder="제목·본문 검색" aria-label="제목·본문 검색" value="${esc(query)}"></div></div>`}
function reviewRows(posts){return posts.length?posts.map(p=>`<button class="reviewrow" data-edit="${esc(p.id)}">${icon(p.channel)}<div><div class="rowtitle">${esc(p.title)}${sample(p)}</div><div class="rowmeta">${CH[p.channel].name} · 출처 ${p.sources.split('\n').filter(s=>s.trim()).length}개 · ${relative(p.updated)} 수정</div></div>${badge(p)}<span class="chev">›</span></button>`).join(''):'<div class="empty">확인할 원고가 없습니다. 소재를 추가해 첫 원고를 만들어 보세요.</div>'}
const WEEKLY_IDS=['blog','youtube','tiktok',...YT_CH_IDS];
const WEEKLY_CHANNELS=[{id:'blog',name:'블로그',why:'글과 사진으로 설명하는 게 편하다면',ch:'blog'},{id:'youtube',name:'유튜브',why:'자료를 정리하고 목소리로 설명할 수 있다면',ch:'youtube'},{id:'tiktok',name:'틱톡',why:'짧은 세로 영상을 직접 만들 수 있다면',ch:null}];
function weekStartSG(ts){const off=8*36e5,sh=new Date(ts+off),day=(sh.getUTCDay()+6)%7;return Date.UTC(sh.getUTCFullYear(),sh.getUTCMonth(),sh.getUTCDate())-day*864e5-off}
function weekStats(ch,now=Date.now(),ytc){const a=weekStartSG(now),b=a+7*864e5,l=db.posts.filter(p=>!p.sample&&p.channel===ch&&(!ytc||p.ytChannel===ytc)&&p.created>=a&&p.created<b);return {n:l.length,approved:l.filter(p=>p.status==='approved').length}}
function weeklySection(){const f=db.profile.weeklyFocus,fc=WEEKLY_CHANNELS.find(c=>c.id===f),yf=YT_CH_BY_ID[f];let line='';if(yf){const k=Math.max(0,3-weekStats('youtube',Date.now(),yf.id).n);line=`이번 주 주력: 유튜브 ${yf.tab} · 남은 목표 ${k}개`}else if(fc){if(fc.ch){const k=Math.max(0,3-weekStats(fc.ch).n);line=`이번 주 주력: ${fc.name} · 남은 목표 ${k}개`}else line='이번 주 주력: 틱톡 · 채널을 추가하면 진행률이 표시됩니다'}return `<div class="weekly"><div class="sectionhead"><h2>일주일에 콘텐츠 세 개를 만들 수 있는 곳이 어디인가</h2></div><div class="weekly-grid">${WEEKLY_CHANNELS.map(c=>{const isYt=c.id==='youtube',on=f===c.id||(isYt&&!!yf),st=c.ch&&!isYt?weekStats(c.ch):null;const body=isYt?`<div class="wrows">${YT_CHANNELS.map(y=>{const s2=weekStats('youtube',Date.now(),y.id),fo=f===y.id;return `<div class="wrow${fo?' focus':''}" data-weekly-row="${y.id}"><div class="wrowhead"><span>${esc(y.tab)}</span><b>이번 주 ${s2.n} / 3</b></div><div class="wbar"><i class="${s2.n>=3?'done':''}" style="width:${Math.min(100,s2.n/3*100)}%"></i></div><small class="small">승인 ${s2.approved}개</small><button class="btn${fo?' primary':''}" data-weekly-focus="${y.id}">${fo?'주력 해제':'집중'}</button></div>`}).join('')}</div>`:st?`<div class="wnum">이번 주 ${st.n} / 3</div><div class="wbar"><i class="${st.n>=3?'done':''}" style="width:${Math.min(100,st.n/3*100)}%"></i></div><small class="small">승인 ${st.approved}개</small>`:'<div><span class="wpill">채널 미추가</span></div>';return `<div class="wcard${on?' focus':''}" data-weekly-card="${c.id}"><div class="whead"><h3>${c.name}</h3>${on?'<span class="badge">주력 채널</span>':''}</div><p class="wwhy">${c.why}</p>${body}${isYt?'':`<button class="btn${on?' primary':''}" data-weekly-focus="${c.id}">${on?'주력 해제':'이 채널에 집중'}</button>`}</div>`}).join('')}</div>${line?`<p class="wfocusline">${line}</p>`:''}</div>`}
document.addEventListener('click',e=>{const t=e.target.closest('button[data-weekly-focus]');if(!t)return;const id=t.dataset.weeklyFocus;if(db.profile.weeklyFocus===id)delete db.profile.weeklyFocus;else db.profile.weeklyFocus=id;persist();render()});
function dashboard(){const posts=filteredPosts(),review=posts.filter(p=>p.status==='review'),approved=posts.filter(p=>p.status==='approved');return head('작업','채널별 원고와 쇼츠를 편집하고 검수하세요.')+notice()+`<div class="stats stats3"><div class="stat"><div class="statlabel">전체 원고 <span>↗</span></div><div class="statvalue">${posts.length.toString().padStart(2,'0')}</div><small>채널별 제작 중인 콘텐츠</small></div><div class="stat"><div class="statlabel">검수 대기 <span>◷</span></div><div class="statvalue orange">${review.length.toString().padStart(2,'0')}</div><small>출처·경험·논지 확인 필요</small></div><div class="stat"><div class="statlabel">승인 완료 <span>✓</span></div><div class="statvalue green">${approved.length.toString().padStart(2,'0')}</div><small>내보내기 가능한 원고</small></div></div>`+toolbar()+projectOverview(posts)+`<div class="sectionhead"><div class="left"><h2>확인이 필요한 원고</h2><span class="number">${review.length}</span></div><button class="linkbtn" data-view="review">모두 보기 ↗</button></div><div class="reviewlist">${reviewRows(review.slice(0,4))}</div><div class="sectionhead"><h2>채널별 작업</h2><span class="small">원고의 상태를 한눈에 확인하세요</span></div><div class="channels">${Object.keys(CH).filter(c=>filter==='all'||filter===c).map(c=>{const list=posts.filter(p=>p.channel===c);return `<div class="channelcard"><div class="cardhead"><div class="left">${icon(c)}<h3>${CH[c].name}</h3></div><span class="small">${list.length}개</span></div>${list.slice(0,3).map(p=>`<button class="channelrow" data-edit="${esc(p.id)}"><div class="title">${esc(p.title)}</div><div class="rowbottom">${badge(p)}<span class="small">${p.body.length.toLocaleString()}자 ↗</span></div></button>`).join('')||'<div class="empty">아직 원고가 없습니다.</div>'}<div class="cardfoot"><span>${isConnected(c)?'브리지 설정됨':'계정 미연결'}</span><button class="linkbtn" data-view="${c}">원고 보기 →</button></div></div>`}).join('')}</div>`+programPrep()+`<div class="activity-wrap"><div class="sectionhead"><h2>최근 활동</h2><span class="small">이 브라우저의 기록</span></div><div class="panel">${db.activity.slice(0,3).map(a=>`<div class="activity"><span class="dot"></span><span>${esc(a.text)}</span><time>${relative(a.at)}</time></div>`).join('')||'<div class="small">활동이 없습니다.</div>'}</div></div>`}
function ideas(){return head('기획','플랫폼을 고르면 주제, 제작 방법, 잘 만드는 법이 보입니다.')+platformStudio()}
function postList(){const c=CH[view]?view:null;const posts=filteredPosts().filter(p=>c?p.channel===c&&(c!=='youtube'||p.ytChannel===ytTab()||!ytValidCh(p.ytChannel)):p.status==='review');return head(c?CH[c].name:'검수함',c?'원고를 편집하고 검수한 뒤 파일로 내보내세요.':'사실·출처·관점을 확인하고 다음 단계로 넘기세요.')+notice()+(c?(c==='youtube'?ytTabs():'')+topicSummary(c,c==='youtube'?ytTab():undefined):'')+toolbar()+`<div class="draft-list">${posts.map(p=>`<div class="draftitem">${icon(p.channel)}<div class="grow"><h3>${esc(p.title)}${sample(p)}${p.channel==='youtube'&&!ytValidCh(p.ytChannel)?'<span class="sampletag">미지정</span>':''}</h3><div class="small">${p.body.length.toLocaleString()}자 · ${relative(p.updated)} 수정</div></div>${badge(p)}<div class="actions"><button class="btn" data-edit="${esc(p.id)}">원고 열기 ↗</button><button class="btn ghost" data-export="${esc(p.id)}">↓</button></div></div>`).join('')||'<div class="panel empty">조건에 맞는 원고가 없습니다.</div>'}</div>`}
const checks=['직접 경험한 내용과 외부 자료를 구분했습니다.','수치·인용·사실의 출처를 확인했습니다.','개인의 해석과 집단 전체에 대한 일반화를 점검했습니다.'];
function ytAssets(p){const m=p.youtubeMeta&&typeof p.youtubeMeta==='object'?p.youtubeMeta:{},options=Array.isArray(m.titleOptions)&&m.titleOptions.length?m.titleOptions:[p.title];return `<section class="panel" id="ytAssets" ${p.channel==='youtube'?'':'hidden'} style="margin:0 0 16px"><div class="sectionhead" style="margin:0 0 10px"><h2>유튜브 제목·썸네일</h2><span class="small">AI 초안은 편집 후 확정</span></div><div class="field"><label for="ytTitleOptions">제목 후보 · 한 줄에 하나</label><textarea id="ytTitleOptions" style="min-height:105px">${esc(options.join('\n'))}</textarea><div class="help">첫 줄이 현재 확정 제목입니다. 후보를 편집한 뒤 마음에 드는 제목을 첫 줄로 올리세요.</div></div><div class="field"><label for="ytThumbnailText">썸네일 문구</label><input class="input" id="ytThumbnailText" maxlength="40" value="${esc(m.thumbnailText||'')}"><div class="help">짧고 읽기 쉬운 문구를 권장합니다. 영상 제목을 그대로 반복하지 마세요.</div></div><div class="field"><label for="ytThumbnailBrief">썸네일 제작 브리프</label><textarea id="ytThumbnailBrief" style="min-height:150px" placeholder="16:9 · 주인공 · 장면 · 구도 · 텍스트 위치 · 색 대비 · 사용할 이미지 권리 확인">${esc(m.thumbnailBrief||'')}</textarea></div><div class="actions"><button class="btn" data-action="copyThumbnailBrief">제작 브리프 복사</button></div><div class="help">Canva·이미지 생성 도구·디자이너에게 이 브리프를 전달하세요. 실제 인물·경기 사진은 사용 권리를 확인해야 합니다.</div></section>`}
function editor(){const p=db.posts.find(p=>p.id===editing);if(!p){editing=null;return dashboard()}const idea=p.ideaId&&db.ideas.find(i=>i.id===p.ideaId),d=draftGet(p.id),draftNew=d&&d.savedAt>p.updated;return head('원고 편집','저장 후 다른 화면으로 이동하세요. 원고 수정 시 기존 승인은 해제됩니다.',false)+`<div class="actions" style="margin-bottom:20px"><button class="btn ghost" data-action="back">← 목록으로</button>${badge(p)}${sample(p)}${!p.sample?`<button class="btn" data-workflow="verify" data-id="${esc(p.id)}" ${p.publish.state==='sending'?'disabled':''}>게시 확인 기록</button>`:''}${idea?`<button class="linkbtn" data-view="ideas" title="경험·소재함으로 이동">소재: ${esc(idea.title)}</button>`:''}<span class="small" id="saveIndicator">저장된 원고</span></div>${draftNew?`<div class="draft-banner" id="draftBanner" role="status"><span>저장하지 않은 임시 원고가 있습니다 (${esc(new Date(d.savedAt).toLocaleString('ko-KR'))})</span><button class="btn" data-action="restoreDraft">복원</button><button class="btn ghost" data-action="discardDraft">버리기</button></div>`:''}<div class="editor-layout"><section class="panel"><div class="field"><label for="postTitle">제목</label><input class="input" id="postTitle" value="${esc(p.title)}" maxlength="200"></div><div class="field"><label for="postChannel">채널</label><select id="postChannel">${Object.keys(CH).map(c=>`<option value="${c}" ${p.channel===c?'selected':''}>${CH[c].name}</option>`).join('')}</select></div><div class="field" id="ytChField" ${p.channel==='youtube'?'':'hidden'}><label for="postYtChannel">유튜브 채널</label><select id="postYtChannel">${ytValidCh(p.ytChannel)?'':'<option value="" selected>미지정</option>'}${YT_CHANNELS.map(y=>`<option value="${y.id}" ${p.ytChannel===y.id?'selected':''}>${esc(ytChName(y.id))}</option>`).join('')}</select></div>${ytAssets(p)}<div class="field" id="naverCatField" ${p.channel==='blog'?'':'hidden'}><label for="postNaverCategory">네이버 카테고리 · 선택</label><select id="postNaverCategory">${categoryOptions(p.naverCategory||'')}</select><div class="help">발행 브리지가 네이버 발행 설정에서 같은 이름의 카테고리를 미리 선택해 봅니다. 실패하면 직접 선택하세요.</div></div><details class="memo-panel"><summary>작업 메모 · 발행되지 않음</summary><div class="inner"><textarea id="postMemo" style="min-height:180px" placeholder="소재 메모, 문체 기준 등 작업용 메모">${esc(p.memo||'')}</textarea><div class="help">이 메모는 발행 브리지로 전송되지 않고 Markdown 내보내기에도 포함되지 않습니다. JSON 백업에는 포함됩니다.</div></div></details><div class="field"><label for="postBody">원고 · Markdown / 일반 텍스트</label><textarea id="postBody" style="min-height:350px">${esc(p.body)}</textarea><div class="charcount" id="charCount">${p.body.length.toLocaleString()}자</div></div><div class="field"><label for="postSources">출처 · 한 줄에 하나씩, URL과 메모</label><textarea id="postSources" placeholder="https://… — 자료 제목 / 확인 날짜">${esc(p.sources)}</textarea></div><div class="actions"><button class="btn primary" data-action="savePost">원고 저장</button><button class="btn" data-action="requestReview">검수함으로 보내기</button></div></section><section><div class="panel"><div class="sectionhead" style="margin-top:0"><h2>콘텐츠 미리보기</h2><span class="small">Markdown 미리보기</span></div><div class="preview"><h2 id="previewTitle">${esc(p.title)}</h2><div id="previewBody">${md(p.body)}</div></div><div class="help">실제 SNS 편집기와 서식이 다를 수 있습니다.</div></div><div class="panel" style="margin-top:16px"><h2>발행 전 검수</h2>${checks.map((t,i)=>`<label class="checkrow"><input type="checkbox" data-check="${i}" ${p.checks[i]?'checked':''}><span>${t}</span></label>`).join('')}<div class="edit-toolbar"><button class="btn primary" data-action="approve">검수 완료 · 승인</button><button class="btn" data-action="exportCurrent">↓ Markdown</button>${p.status==='approved'&&!p.sample?'<button class="btn" data-view="publish">발행 센터로</button>':''}${p.status==='approved'&&!p.sample&&p.channel==='blog'?`<button class="btn" data-naver-copy="${esc(p.id)}">본문 복사 · 네이버 글쓰기 열기</button>`:''}</div><div class="warning">승인해도 바로 게시되지 않습니다. 발행은 발행 센터에서 직접 전송하세요.</div></div><div class="actions" style="margin-top:16px;justify-content:flex-end"><button class="btn ghost danger" data-action="deletePost">원고 삭제</button></div></section></div>`}

function ideaModal(id){const i=db.ideas.find(i=>i.id===id);modal(`<div class="modalhead"><div><div class="eyebrow">NEW FIELD NOTE</div><h2 id="modalTitle">${i?'소재 수정':'경험을 기록하세요'}</h2></div><button class="close" data-action="close" aria-label="닫기">×</button></div><form id="ideaForm" data-id="${esc(id||'')}"><div class="field"><label for="ideaTitle">소재 제목</label><input id="ideaTitle" class="input" required maxlength="200" placeholder="어떤 장면이나 질문에서 시작하나요?" value="${esc(i?.title||'')}"></div><div class="field"><label for="ideaNote">경험과 생각</label><textarea id="ideaNote" required style="min-height:160px" placeholder="언제 / 어디서 / 직접 본 것 / 느낀 점 / 확인하고 싶은 것">${esc(i?.note||'')}</textarea></div><div class="field"><label for="ideaSources">참고 링크·자료</label><textarea id="ideaSources" placeholder="한 줄에 하나씩 기록하세요.">${esc(i?.sources||'')}</textarea></div><p class="help">입력한 내용은 이 브라우저에만 저장됩니다.</p><div class="modalfooter"><button type="button" class="btn ghost" data-action="close">취소</button><button class="btn primary" type="submit">${i?'변경 저장':'소재 저장'}</button></div></form>`)}
function createModal(id){modal(`<div class="modalhead"><h2 id="modalTitle">어떤 원고를 만들까요?</h2><button class="close" data-action="close" aria-label="닫기">×</button></div><form id="createForm" data-id="${esc(id)}"><div class="field"><label for="createChannel">제작할 채널</label><select id="createChannel">${Object.keys(CH).map(c=>`<option value="${c}" ${ideaChannel(db.ideas.find(i=>i.id===id)||{})===c?'selected':''}>${CH[c].name}</option>`).join('')}</select></div><p class="subtitle">메모와 출처를 넣은 편집용 원고 틀을 만듭니다. AI가 글이나 이미지를 생성하는 기능은 아닙니다.</p><div class="modalfooter"><button class="btn primary" type="submit">원고 틀 만들기</button></div></form>`)}
function template(i,c){const memo=`## 작업 메모\n${i.note}\n\n## 채널 관심 주제\n${favoriteTopics(c).map(t=>t.name).join(' · ')}\n\n## 문체·편집 기준\n${c==='blog'&&i.naverCategory?(db.profile.blogVoice||db.profile.tone):db.profile.tone}`;const structures={blog:'## 직접 본 장면\n[메모를 바탕으로 경험을 작성하세요.]\n\n## 확인한 배경\n[원문과 근거를 확인해 작성하세요.]\n\n## 기독교 관점의 비교·비평\n[교리, 타인의 주장, 나의 해석을 구분하세요.]\n\n## 한국과 비교할 때의 한계\n[제도·역사·사회적 맥락의 차이를 적으세요.]\n\n## 한국에 던지는 질문\n[근거가 뒷받침하는 질문으로 마무리하세요.]',insta:'1장 · 핵심 질문\n[짧고 구체적인 질문]\n\n2장 · 직접 본 장면\n[경험과 관찰]\n\n3장 · 배경 사실\n[확인된 근거]\n\n4장 · 설명·논평\n[확인된 사실과 내 해석 구분]\n\n5장 · 맥락과 한계\n[전후 상황과 아직 확인되지 않은 것]\n\n6장 · 독자에게 던지는 질문\n[마무리]\n\n캡션\n[본문 요약과 출처 안내]',youtube:'00–05초 · 사건·장면 소개\n[확인한 핵심 상황]\n\n05–20초 · 맥락\n[원본 영상·발생지·날짜·등장인물 확인]\n\n20–40초 · 장면과 해설\n[사실·인용·내 논평을 구분]\n\n40–55초 · 결과와 반전\n[확인된 후속 결과 / 모르면 미확인 표시]\n\n55–60초 · 마무리\n[핵심 정리]\n\n제작 확인\n[원본 영상 사용 권리·허락·개인정보·재연 여부 확인]\n\n설명란\n[원본 출처·추가 맥락·정정 안내]'};return {memo,body:c==='blog'&&i.naverCategory?BLOG_CATEGORY_TEMPLATE:(structures[c]||platformTemplate(c))}}
function saveEditor(target){const p=db.posts.find(p=>p.id===editing);if(!p)return false;const title=$('#postTitle').value.trim(),body=$('#postBody').value,sources=$('#postSources').value,channel=$('#postChannel').value,memo=$('#postMemo').value,naverCategory=$('#postNaverCategory').value.trim(),ytCh=channel==='youtube'?(ytValidCh($('#postYtChannel').value)||ytValidCh(p.ytChannel)||ytTab()):'',youtubeMeta=channel==='youtube'?ytMetaForm():null;if(!title){toast('제목을 입력하세요.');$('#postTitle').focus();return false}if(channel==='youtube'&&youtubeMeta.titleOptions.length&&title!==youtubeMeta.titleOptions[0])youtubeMeta.titleOptions.unshift(title);const changed=p.title!==title||p.body!==body||p.sources!==sources||p.channel!==channel||(p.memo||'')!==memo||(p.naverCategory||'')!==naverCategory||(p.ytChannel||'')!==ytCh||JSON.stringify(p.youtubeMeta||{})!==JSON.stringify(youtubeMeta||{});const checkValues=Array.from(document.querySelectorAll('[data-check]')).map(el=>el.checked);if(target==='approved'&&!checkValues.every(Boolean)){toast('검수 항목 3개를 모두 확인하세요.');return false}if(target==='approved'&&!body.trim()){toast('원고를 작성하세요.');return false}if(target==='approved'){const marks=aiMarkCount(body);if(marks){toast(AI_MARK_MSG(marks));return false}}if(target==='approved'){const ph=placeholderLines(body);if(ph.length){toast(`원고에 채우지 않은 자리표시자 ${ph.length}곳이 남아 있습니다 (예: ${ph[0].slice(0,24)}). 작성하거나 지운 뒤 승인하세요.`);return false}}if(p.channel!==channel)delete p.publicationCheck;p.title=title;p.body=body;p.memo=memo;p.naverCategory=naverCategory;p.sources=sources;p.channel=channel;if(ytCh)p.ytChannel=ytCh;else delete p.ytChannel;if(youtubeMeta)p.youtubeMeta=youtubeMeta;else delete p.youtubeMeta;p.checks=checkValues;p.status=target||(p.status==='approved'&&(changed||!checkValues.every(Boolean))?'draft':p.status);p.updated=Date.now();log(target==='approved'?'원고 검수 승인: '+title:target==='review'?'검수 요청: '+title:'원고 저장: '+title);persist();clearTimeout(draftTimer);draftDel(p.id);dirty=false;render();toast(target==='approved'?'승인 완료. 외부 게시물은 발행하지 않았습니다.':target==='review'?'검수함으로 보냈습니다.':'원고를 저장했습니다.');return true}
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function exportPost(id){const p=db.posts.find(p=>p.id===id);if(!p)return;download(p.title.replace(/[\\/:*?"<>|]/g,'_').slice(0,90)+'.md',`# ${p.title}\n\n${p.body}\n\n---\n\n## 출처\n${p.sources||'미입력'}\n\n작업 상태: ${STATUS[p.status]} / 채널: ${CH[p.channel].name}\n`,'text/markdown;charset=utf-8');toast('Markdown 파일을 내보냈습니다.')}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.view){navigate(t.dataset.view);return}if(t.dataset.filter){filter=t.dataset.filter;render();return}if(t.dataset.edit){openPost(t.dataset.edit);return}if(t.dataset.create){createModal(t.dataset.create);return}if(t.dataset.ideaEdit){ideaModal(t.dataset.ideaEdit);return}if(t.dataset.ideaDelete){if(confirm('이 소재를 삭제할까요? 연결된 원고는 유지됩니다.')){db.ideas=db.ideas.filter(i=>i.id!==t.dataset.ideaDelete);log('소재를 삭제했습니다');persist();render()}return}if(t.dataset.export){exportPost(t.dataset.export);return}switch(t.dataset.action){case'newIdea':ideaModal();break;case'close':closeModal();break;case'back':navigate(CH[view]?view:'dashboard');break;case'savePost':saveEditor();break;case'requestReview':saveEditor('review');break;case'approve':saveEditor('approved');break;case'exportCurrent':if(saveEditor())exportPost(editing);break;case'backup':download('fieldnote-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(backupData(),null,2),'application/json');toast('워크스페이스 백업을 내보냈습니다. 브리지 토큰은 포함되지 않습니다.');break;case'import':$('#importFile').click();break;case'saveSettings':{const name=$('#profileName').value.trim();if(!name){toast('워크스페이스 이름을 입력하세요.');return}db.profile={...db.profile,name,tone:$('#profileTone').value,blogVoice:$('#profileBlogVoice').value};db.ytChannels=YT_CHANNELS.map(y=>({id:y.id,name:($('#ytName-'+y.id).value.trim()||y.name),voice:$('#ytVoice-'+y.id).value}));log('편집 기준을 저장했습니다');persist();render();toast('설정을 저장했습니다.');break}case'clearSamples':if(confirm('예시로 표시된 소재와 원고만 삭제할까요?')){db.ideas=db.ideas.filter(i=>!i.sample);db.posts=db.posts.filter(p=>!p.sample);log('예시 데이터를 지웠습니다');persist();render();toast('예시 데이터를 지웠습니다.')}break;case'deletePost':if(confirm('이 원고를 삭제할까요? 삭제 후 되돌릴 수 없습니다.')){clearTimeout(draftTimer);draftDel(editing);db.posts=db.posts.filter(p=>p.id!==editing);log('원고를 삭제했습니다');persist();dirty=false;editing=null;render()}break;}});
document.addEventListener('submit',e=>{if(e.target.id==='ideaForm'){e.preventDefault();const f=e.target,id=f.dataset.id,old=db.ideas.find(i=>i.id===id),title=$('#ideaTitle').value.trim(),note=$('#ideaNote').value.trim(),sources=$('#ideaSources').value;if(!title||!note){toast('제목과 경험 메모를 입력하세요.');return}if(old)Object.assign(old,{title,note,sources});else db.ideas.unshift({id:uid(),title,note,sources,created:Date.now(),sample:false,...(PF_NAME[view]?{platform:PF_NAME[view],...(['youtube','blog','insta'].includes(view)?{preferredChannel:view}:{}),...(view==='youtube'?{ytFormat:ytPipe.format}:{})}:{})});log((old?'소재 수정: ':'새 소재: ')+title);persist();closeModal();navigate(view);toast('소재를 저장했습니다.')}if(e.target.id==='createForm'){e.preventDefault();if(!canLeave())return;const i=db.ideas.find(i=>i.id===e.target.dataset.id),channel=$('#createChannel').value;if(!i)return;const p=newPost(i,channel,i.sample);db.posts.unshift(p);log(CH[channel].short+' 원고 틀 생성: '+i.title);persist();closeModal();dirty=false;editing=p.id;view=channel;render();toast('편집용 원고 틀을 만들었습니다.')}});
document.addEventListener('input',e=>{if(['postTitle','postBody','postSources','postChannel','postYtChannel','postMemo','postNaverCategory','ytTitleOptions','ytThumbnailText','ytThumbnailBrief'].includes(e.target.id))editorInput()});
document.addEventListener('click',e=>{if(!e.target.closest('button[data-action="copyThumbnailBrief"]'))return;const brief=$('#ytThumbnailBrief')?.value.trim();if(!brief){toast('먼저 썸네일 제작 브리프를 입력하세요.');return}copyText(brief).then(ok=>toast(ok?'썸네일 제작 브리프를 복사했습니다.':'복사하지 못했습니다. 직접 선택해 복사하세요.'))});

$('#importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>10000000)throw Error('백업은 10MB 이하만 불러올 수 있습니다.');const incoming=prepareImport(validate(JSON.parse(await file.text())));if(confirm('백업으로 현재 소재·원고·설정을 교체할까요? 먼저 JSON 백업을 권장합니다.')){db=incoming;log('JSON 백업을 복원했습니다');persist();dirty=false;editing=null;view='dashboard';filter='all';query='';render();toast('백업을 복원했습니다.')}}catch(err){toast('복원 실패: '+err.message)}e.target.value=''});
document.addEventListener('keydown',e=>{if($('#modalRoot').firstChild){if(e.key==='Escape')closeModal();if(e.key==='Tab'){const all=Array.from($('#modalRoot').querySelectorAll('button,input,textarea,select,[tabindex="0"]')).filter(el=>!el.disabled);if(e.shiftKey&&document.activeElement===all[0]){e.preventDefault();all.at(-1)?.focus()}else if(!e.shiftKey&&document.activeElement===all.at(-1)){e.preventDefault();all[0]?.focus()}}}if(e.key==='Escape'&&$('#sidebar').classList.contains('open'))closeSidebar();if((e.metaKey||e.ctrlKey)&&e.key==='s'&&editing){e.preventDefault();saveEditor()}});
/* Publish bridge: a browser-side queue. Platform credentials remain in a separate bridge. */
function ensurePublish(x=db){if(!x.integrations||typeof x.integrations!=='object')x.integrations={};Object.keys(CH).forEach(c=>{const i=x.integrations[c];if(!i||typeof i!=='object')x.integrations[c]={endpoint:'',token:'',checkedAt:0,checkedOk:null,checkedMsg:''};});x.posts.forEach(p=>{if(!p.publish||typeof p.publish!=='object')p.publish={state:'not_requested',requestedAt:0,url:'',message:''};});}
/* One-time load migrations (never run on render): memo/naverCategory fields, legacy memo split, stale 'sending'. */
const MEMO_HEADS=['## 작업 메모','## 채널 관심 주제','## 문체·편집 기준'],STRUCT_STARTS=['1장 · 핵심 질문','00–05초 · 사건·장면 소개'];
function splitLegacyMemo(body){const t=String(body).replace(/\r\n?/g,'\n');if(!t.startsWith('## 작업 메모'))return {memo:'',body};const ls=t.split('\n');let cut=-1;for(let k=1;k<ls.length;k++){const l=ls[k].trimEnd();if(MEMO_HEADS.includes(l))continue;if(/^#{1,6}\s/.test(l)||STRUCT_STARTS.includes(l)){cut=k;break}}if(cut<0){const h=ls.findIndex(l=>l.trimEnd()==='## 문체·편집 기준');if(h>=0){const blank=ls.findIndex((l,k)=>k>h+1&&!l.trim());cut=blank<0?ls.length:blank+1}else cut=ls.length}return {memo:ls.slice(0,cut).join('\n').trim(),body:ls.slice(cut).join('\n').replace(/^\n+/,'')}}
function migrateDb(x){for(const p of x.posts){if(typeof p.memo!=='string'){const r=splitLegacyMemo(p.body);p.memo=r.memo;p.body=r.body}if(typeof p.naverCategory!=='string')p.naverCategory=''}return x}
function recoverSending(x){for(const p of x.posts)if(p.publish?.state==='sending')p.publish={...p.publish,state:'failed',message:'전송 중 창이 닫혀 결과를 확인하지 못했습니다. 네이버에서 초안 여부를 확인하세요.'};return x}
function ytChannelOfTopic(id){const t=db.interests.find(k=>k.id===id);return (t&&ytValidCh(t.ytChannel))||(YT_BY_ID[id]&&YT_BY_ID[id].ytChannel)||''}
function newPost(i,channel,isSample){const t=template(i,channel);return {id:uid(),ideaId:i.id,title:i.title,channel,body:t.body,memo:t.memo,naverCategory:channel==='blog'?(i.naverCategory||''):'',...(channel==='youtube'?{ytChannel:ytValidCh(i.ytChannel)||ytChannelOfTopic(i.topicId)||ytTab()}:{}),sources:i.sources,status:'draft',checks:[false,false,false],sample:!!isSample,created:Date.now(),updated:Date.now(),publish:{state:'not_requested',requestedAt:0,url:'',message:''}}}
/* Backups never contain bridge tokens; restoring keeps this browser's token when the backup has none. */
function backupData(){const c=JSON.parse(JSON.stringify(db));if(c.integrations&&typeof c.integrations==='object')for(const k of Object.keys(c.integrations))if(c.integrations[k]&&typeof c.integrations[k]==='object')delete c.integrations[k].token;return c}
function prepareImport(x){migrateDb(x);ensurePublish(x);recoverSending(x);for(const c of Object.keys(CH)){const n=x.integrations[c],cur=db.integrations?.[c];if(typeof n.token!=='string')n.token='';if(!n.token&&cur?.token&&(!n.endpoint||n.endpoint===cur.endpoint))n.token=cur.token}return x}
function isConnected(c){return /^https?:\/\//.test(db.integrations?.[c]?.endpoint||'')}
function publishState(p){return p.publish?.state==='published'?'게시됨':p.publish?.state==='sending'?'전송 중':p.publish?.state==='failed'?'전송 실패':p.publish?.state==='queued'?'발행 대기':'미요청'}
function autoPlan(id){const i=db.ideas.find(x=>x.id===id);if(!i)return;const added=[];Object.keys(CH).forEach(c=>{db.posts.unshift(newPost(i,c,false));added.push(CH[c].short)});log('3채널 작업 묶음 생성: '+i.title);persist();render();toast(added.join(' · ')+' 원고 틀을 만들었습니다.');}

on><div class="bridge-note"><strong>실제 자동 발행의 경계</strong><br>이 화면은 승인 게이트와 전송 요청을 처리합니다. 비밀번호·OAuth 비밀값은 이 HTML에 저장하지 않습니다. 각 플랫폼 API 권한을 보관하는 발행 브리지 URL을 연결해야 실제 게시가 됩니다.</div>`}

 const tabDefs=ytTabDefs(ytTab());if(!tabDefs.some(d=>d.id===ytTopicId)&&tabDefs[0])ytTopicId=tabDefs[0].id;
 const def=YT_BY_ID[ytTopicId]||YT_TOPICS[0],id=def.id,busy=genBusy!==null,fmt=ytFormat();
 const list=ytIdeas(id),shown=list.slice(0,12),hasAi=list.length>0;

 const opts=tabDefs.map(d=>`<option value="${esc(d.id)}" ${d.id===id?'selected':''}>${esc((db.interests.find(t=>t.id===d.id)||d).name)}</option>`).join('');
 return `<section class="panel gen-panel" id="ytPanel"><div class="sectionhead" style="margin:0 0 10px"><h2>유튜브 주제 생성기</h2><span class="statuspill">AI 1차 대본 → 사람 검수</span></div><p class="small" style="margin:0">주제와 형식을 고른 뒤 AI가 훅·대본·화면 지시를 포함한 1차 대본을 만듭니다. 출처·클립 사용 권리는 승인 전에 확인합니다.</p><div class="gen-controls"><div class="field"><label for="ytTopic">주제</label><select id="ytTopic">${opts}</select></div><div class="field"><label for="ytFormat">형식</label><select id="ytFormat"><option value="shorts" ${fmt==='shorts'?'selected':''}>쇼츠 (60초)</option><option value="long" ${fmt==='long'?'selected':''}>롱폼 (8~10분)</option></select></div><div class="actions"><button class="btn primary" data-action="ytGenTopics" data-yt-topic="${esc(id)}" ${busy?'disabled':''}>${label('topics','주제 프롬프트')}</button><button class="btn" data-action="ytGenMore" data-yt-topic="${esc(id)}" ${busy||!hasAi?'disabled':''}>${label('more','추가 주제 프롬프트')}</button></div></div><p class="help">${esc(ytTopicNote(id))} · 자동 생성은 AI 환경변수가 설정된 배포에서만 작동합니다.</p>${shown.length?`<div class="idea-grid" style="margin-top:14px">${shown.map(i=>{const linked=db.posts.filter(p=>p.ideaId===i.id).length;return `<article class="idea"><div class="actions" style="margin:0 0 8px;gap:4px"><span class="sampletag ai">AI 생성</span><span class="sampletag">${esc(def.name)}</span><span class="sampletag">${i.format==='long'?'롱폼':'쇼츠'}</span></div><h3>${esc(i.title)}</h3><p>${esc(i.note)}</p>${linked?`<div class="small">연결된 원고 ${linked}개</div>`:''}<div class="actions"><button class="btn primary" data-gen-draft="${esc(i.id)}" ${busy?'disabled':''}>${genBusy==='draft:'+i.id?'AI 작성 중…':'AI 대본 생성'}</button><button class="btn ghost" data-gen-draft-manual="${esc(i.id)}" ${busy?'disabled':''}>프롬프트 방식</button><button class="btn ghost" data-create="${esc(i.id)}">직접 원고 틀</button><button class="btn ghost danger" data-idea-delete="${esc(i.id)}" aria-label="주제 삭제">삭제</button></div></article>`}).join('')}</div>${list.length>shown.length?`<p class="help">최신 ${shown.length}개만 표시합니다. 나머지 ${list.length-shown.length}개는 경험·소재함에서 볼 수 있습니다.</p>`:''}`:`<div class="empty" style="padding:18px">이 주제에는 아직 생성된 소재가 없습니다. "주제 프롬프트"을 눌러 보세요.</div>`}</section>`
}
function ytGenTopics(id){manualYoutubeTopics(id)}
function ytBody(d){
 const t=v=>String(v??'').trim(),segs=(Array.isArray(d.script)?d.script:[]).filter(s=>s&&t(s.narration)).map(s=>`### ${t(s.time)||'00:00'}\n${t(s.narration)}${t(s.on_screen)?`\n화면: ${t(s.on_screen)}`:''}`);
 if(!segs.length)return '';
 return `## 썸네일 문구\n${t(d.thumbnail_text)}\n\n## 첫 3초\n${t(d.hook)}\n\n## 대본\n${segs.join('\n\n')}\n\n## 설명란\n${t(d.description)}`;
}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t||t.disabled)return;if(t.dataset.action==='ytGenTopics'||t.dataset.action==='ytGenMore')ytGenTopics(t.dataset.ytTopic||ytTopicId,t.dataset.action==='ytGenMore'?'more':'topics')});
document.addEventListener('change',e=>{if(e.target.id==='ytTopic'&&YT_BY_ID[e.target.value]){ytTopicId=e.target.value;render()}if(e.target.id==='ytFormat'&&['shorts','long'].includes(e.target.value)){db.profile.youtubeFormat=e.target.value;persist();render()}});
/* ===== 네이버 수동 발행: 본문 복사 + 글쓰기 열기 (브리지 없이 어느 컴퓨터에서나) ===== */
/* markdownToPlain/buildPostText mirror naver-bridge/text.mjs (a test keeps them identical). */
function markdownToPlain(src){const out=String(src??'').replace(/\r\n?/g,'\n').split('\n').filter(line=>!/^\s*(```|~~~)/.test(line)).map(line=>{let s=line;s=s.replace(/^\s{0,3}#{1,6}\s+/,'');s=s.replace(/^(\s*)[-*]\s+/,'$1• ');s=s.replace(/`([^`]*)`/g,'$1');s=s.replace(/!?\[([^\]]*)\]\(([^)\s]+)\)/g,'$1 ($2)');s=s.replace(/\*\*([^*]+)\*\*/g,'$1');s=s.replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g,'$1$2');return s.replace(/\s+$/,'')}).join('\n');return out.replace(/\n{3,}/g,'\n\n').trim()}
function buildPostText(post){let text=markdownToPlain(post.body);const sources=String(post.sources??'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);if(sources.length)text+=`\n\n출처\n${sources.join('\n')}`;return text}
function naverCopyText(p){const cat=String(p.naverCategory??'').trim();return `${p.title}\n\n${buildPostText(p)}`+(cat?`\n\n카테고리: ${cat}`:'')}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(_){}try{const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.append(a);a.select();const ok=document.execCommand('copy');a.remove();return ok}catch(_){return false}}
const NAVER_WRITE_URL='https://blog.naver.com/PostWriteForm.naver';
function copyToNaver(id){
 const p=db.posts.find(x=>x.id===id);if(!p||p.channel!=='blog'||p.status!=='approved'||p.sample||p.publicationCheck||['published','sending'].includes(p.publish?.state))return;
 if(editing&&dirty){toast('저장하지 않은 변경이 있습니다. 먼저 원고를 저장하세요.');return}
 const text=naverCopyText(p),pending=copyText(text);window.open(NAVER_WRITE_URL,'_blank','noopener');
 pending.then(ok=>{
  if(!ok){toast('클립보드 복사에 실패했습니다. 브라우저 권한을 확인하거나 원고 편집 화면에서 직접 복사하세요.');return}
  const cat=String(p.naverCategory??'').trim();
  p.publish={state:'queued',requestedAt:Date.now(),url:'',message:'수동 발행 준비'};log('네이버 수동 발행 준비: '+p.title);persist();if(!(editing&&dirty))render();
  toast(`본문을 복사했고 네이버 글쓰기를 열었습니다. 붙여 넣은 뒤 ${cat?`카테고리 "${cat}"를 선택하고 `:'카테고리를 선택하고 '}등록은 직접 누르세요.`);
 });
}
document.addEventListener('click',e=>{const t=e.target.closest('button[data-naver-copy]');if(t)copyToNaver(t.dataset.naverCopy)});

/* ===== 클라우드 동기화: http(s)로 열렸고 로그인 세션이 있을 때만. file:// 은 기존 로컬 모드 그대로 ===== */
const cloud={on:false,loaded:false,version:0,state:'local',at:0,timer:null,retry:null,inflight:false,again:false,dirty:false,editedBeforeLoad:false,conflict:null,initDone:false};
const SYNC_DELAY=1500,RETRY_MS=30000;
const canCloud=()=>/^https?:$/.test(location.protocol)&&typeof fetch==='function';
const goLogin=()=>{location.href='/login.html?next='+encodeURIComponent(location.pathname+location.search)};
function storageLabel(){
 if(cloud.on){switch(cloud.state){case'syncing':return'동기화 중…';case'offline':return'오프라인 · 이 브라우저에만 저장';case'conflict':return'충돌 · 선택이 필요합니다';default:return cloud.at?'클라우드 저장됨 · '+relative(cloud.at):'클라우드 연결됨'}}
 if(!storageOK)return'저장 불가 · JSON 백업 필요';
 return cloud.state==='offline'?'오프라인 · 이 브라우저에만 저장':'이 브라우저에 저장'
}
function paintStorage(){const el=$('#storageState');if(el)el.textContent=storageLabel();const b=$('#logoutBtn');if(b)b.hidden=!cloud.on}
function setCloud(state){cloud.state=state;paintStorage()}
setInterval(paintStorage,30000);
function syncPayload(){const c=JSON.parse(JSON.stringify(db));delete c.integrations;return c}
function cacheLocal(){try{localStorage.setItem(KEY,JSON.stringify(db));storageOK=true}catch(_){storageOK=false}}
async function jfetch(url,opts={},ms=30000){const ctrl=new AbortController(),to=setTimeout(()=>ctrl.abort(),ms);try{return await fetch(url,{credentials:'same-origin',...opts,signal:ctrl.signal})}finally{clearTimeout(to)}}
function cloudDirty(){
 if(!cloud.on&&!cloud.booting)return;
 cloud.dirty=true;
 if(!cloud.loaded){cloud.editedBeforeLoad=true;return}
 if(cloud.state==='conflict')return;
 setCloud('syncing');clearTimeout(cloud.timer);cloud.timer=setTimeout(syncNow,SYNC_DELAY)
}
function scheduleRetry(){clearTimeout(cloud.retry);cloud.retry=setTimeout(retryNow,RETRY_MS)}
function retryNow(){
 clearTimeout(cloud.retry);
 if(!cloud.initDone)return cloudInit();
 if(!cloud.on)return;
 if(!cloud.loaded)return cloudLoad();
 if(cloud.state==='offline')return syncNow()
}
async function syncNow(){
 clearTimeout(cloud.timer);
 if(!cloud.on||!cloud.loaded||cloud.state==='conflict')return;
 if(cloud.inflight){cloud.again=true;return}
 cloud.inflight=true;cloud.again=false;cloud.dirty=false;setCloud('syncing');
 let res,data=null;
 try{res=await jfetch('/api/data',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:syncPayload(),baseVersion:cloud.version})});try{data=await res.json()}catch(_){}}
 catch(_){cloud.inflight=false;cloud.dirty=true;setCloud('offline');scheduleRetry();return}
 cloud.inflight=false;
 if(res.ok&&data&&data.ok){cloud.version=data.version;cloud.at=Date.now();setCloud('saved');if(cloud.dirty||cloud.again)cloud.timer=setTimeout(syncNow,SYNC_DELAY);return}
 if(res.status===409&&data&&data.conflict){showConflict(data);return}
 cloud.dirty=true;setCloud('offline');
 if(res.status===401){toast('로그인이 만료되었습니다. 다시 로그인하세요.');setTimeout(goLogin,1500);return}
 toast('클라우드 저장 실패: '+((data&&data.message)||'HTTP '+res.status));scheduleRetry()
}
function adoptServer(sd){
 sd.integrations=db.integrations;           // bridge URL/token and drafts never leave this computer
 const inc=prepareImport(validate(sd));
 db=inc;cacheLocal();dirty=false;if(editing&&!db.posts.some(p=>p.id===editing))editing=null;render()
}
function showConflict(data){
 cloud.conflict={data:data.data,version:data.version};setCloud('conflict');
 if($('#cloudBanner'))return;
 const b=document.createElement('div');b.id='cloudBanner';b.className='draft-banner';b.setAttribute('role','alert');
 b.innerHTML='<span style="flex:0 1 auto">다른 컴퓨터에서 변경된 내용이 있습니다</span><button class="btn" data-cloud="load">서버 버전 불러오기</button><button class="btn ghost" data-cloud="overwrite">내 버전으로 덮어쓰기</button>';
 document.body.prepend(b)
}
function endConflict(){$('#cloudBanner')?.remove();cloud.conflict=null}
document.addEventListener('click',e=>{
 const t=e.target.closest('button[data-cloud]');if(!t||!cloud.conflict)return;
 const c=cloud.conflict;
 if(t.dataset.cloud==='load'){
  try{adoptServer(c.data)}catch(err){toast('서버 데이터를 읽지 못했습니다: '+err.message);return}
  cloud.version=c.version;cloud.at=Date.now();endConflict();setCloud('saved');toast('서버 버전을 불러왔습니다.')
 }else{
  cloud.version=c.version;endConflict();setCloud('syncing');syncNow();toast('내 버전으로 덮어씁니다.')
 }
});
async function cloudLoad(){
 let res,data=null;
 try{res=await jfetch('/api/data',{},20000);try{data=await res.json()}catch(_){}}catch(_){setCloud('offline');scheduleRetry();return}
 if(res.status===401){setCloud('offline');goLogin();return}
 if(!res.ok||!data||!data.ok){setCloud('offline');toast('클라우드 데이터를 불러오지 못했습니다: '+((data&&data.message)||'HTTP '+res.status));scheduleRetry();return}
 if(data.data==null){cloud.version=Number(data.version)||0;cloud.loaded=true;cloud.editedBeforeLoad=false;cloud.dirty=true;await syncNow();return}
 if(cloud.editedBeforeLoad){cloud.loaded=true;showConflict(data);return}
 try{adoptServer(data.data)}catch(err){setCloud('offline');toast('서버 데이터를 읽지 못했습니다: '+err.message);scheduleRetry();return}
 cloud.version=Number(data.version)||0;cloud.loaded=true;cloud.at=Date.now();setCloud('saved')
}
function loadingOverlay(on){let el=$('#cloudLoading');if(on&&!el){el=document.createElement('div');el.id='cloudLoading';el.setAttribute('role','status');el.textContent='클라우드에서 불러오는 중…';document.body.append(el)}else if(!on&&el)el.remove()}
async function cloudInit(){
 let s=null;
 try{const r=await jfetch('/api/session',{},15000);if(r.ok)s=await r.json();cloud.initDone=true}
 catch(_){loadingOverlay(false);setCloud('offline');scheduleRetry();return}  /* booting stays true: edits made offline count as local edits */
 cloud.booting=false;
 if(!(s&&s.ok===true&&s.cloud===true)){loadingOverlay(false);cloud.state='local';paintStorage();return}
 cloud.on=true;paintStorage();
 await cloudLoad();loadingOverlay(false)
}
async function cloudLogout(){
 try{if(cloud.timer||cloud.dirty||cloud.state==='syncing'){clearTimeout(cloud.timer);cloud.again=false;await syncNow()}}catch(_){}
 try{await jfetch('/api/logout',{method:'POST'},10000)}catch(_){}
 location.href='/login.html'
}
function cloudBoot(){
 $('#logoutBtn').addEventListener('click',cloudLogout);
 if(!canCloud())return;
 cloud.booting=true;loadingOverlay(true);cloudInit();
 window.addEventListener('online',retryNow);
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&cloud.on&&cloud.timer&&cloud.state==='syncing')syncNow()})
}

window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});$('#mobileMenu').onclick=()=>$('#sidebar').classList.toggle('open');$('#sidebarBackdrop').onclick=closeSidebar;$('#date').textContent=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Singapore',month:'long',day:'numeric',weekday:'short'}).format(new Date());ensureAnalytics(db);migrateDb(db);ensurePublish();recoverSending(db);{const r0=parseHash(location.hash);view=r0.view;editing=r0.edit||null;syncHash(true)}render();if(storageOK)persist();cloudBoot();
</script></body></html>
